<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f2f5f3">
    <title>LohasCare GeronTalk — 樂活智語 · 樂齡言語復康系統</title>

    <!-- 修復：改用官方可用之最新 tasks-vision CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js" crossorigin="anonymous"></script>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-gray: #f5f5f7;
            --apple-dark-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
            --ts-bg: #f2f5f3;
            --paper: rgba(255, 255, 255, 0.96);
            --gold: #8B6914;
            --speech-purple: #9b5de5;
            --mouth-pink: #ff99b6;
            --ai-blue: #00b4d8;
            --radius-sm: 14px;
            --radius-md: 24px;
            --radius-lg: 36px;
            --font-scale: 1;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang HK", "Microsoft JhengHei", sans-serif;
            letter-spacing: -0.02em;
        }
        html { font-size: calc(16px * var(--font-scale)); }
        body {
            background: var(--ts-bg);
            margin: 0;
            color: var(--apple-black);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body.high-contrast {
            --ts-bg: #000;
            --paper: #1a1a1a;
            --apple-black: #fff;
            --apple-dark-gray: #ccc;
            --apple-gray: #333;
        }
        body.high-contrast .login-card,
        body.high-contrast .modal-content,
        body.high-contrast header,
        body.high-contrast .card-unit,
        body.high-contrast .score-badge {
            background: #1a1a1a !important;
            border-color: #444 !important;
            color: #fff !important;
        }

        /* ===== 登入介面 ===== */
        #login-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 40%, #ffffff 0%, var(--ts-bg) 100%);
            z-index: 20000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .login-card {
            background: var(--paper);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.6);
            text-align: center;
            width: 100%; max-width: 520px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.06);
        }
        .login-card h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.03em; }
        .login-card .tagline { font-size: 1.1rem; color: var(--apple-dark-gray); margin: 0 0 8px; font-weight: 600; }
        .login-card .version-badge {
            display: inline-block; background: var(--apple-blue); color: #fff;
            font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 24px;
        }
        .login-card input {
            font-size: 1.25rem; width: 100%; padding: 16px 18px; margin-bottom: 16px;
            border-radius: var(--radius-sm); border: 2px solid rgba(0,0,0,0.12);
            background: rgba(255,255,255,0.95); outline: none; transition: all 0.25s;
        }
        .login-card input:focus {
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
        }
        .login-hint { font-size: 0.95rem; color: var(--apple-dark-gray); margin-top: 16px; line-height: 1.4; }

        /* ===== 主介面 Header ===== */
        header {
            background: var(--paper);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.07);
            padding: 16px 18px 12px;
            text-align: center;
            flex-shrink: 0;
        }
        #app-content { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        #time { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
        .header-meta {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 640px; margin: 8px auto 0; font-size: 1.05rem;
            color: var(--apple-dark-gray); font-weight: 600;
        }
        .header-btns { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .apple-pill-btn {
            background: rgba(0,0,0,0.06); color: var(--apple-black);
            padding: 8px 14px; font-size: 0.95rem; border-radius: 22px;
            border: none; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .apple-pill-btn:hover { background: rgba(0,0,0,0.1); }
        .apple-pill-btn.primary { background: var(--apple-blue); color: #fff; }
        .apple-pill-btn.danger { background: rgba(255,59,48,0.12); color: var(--apple-red); }

        .nav-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .nav-grid {
            display: flex; flex-direction: column; gap: 14px;
            padding: 20px 16px 40px; align-items: center;
            max-width: 560px; width: 100%; margin: 0 auto;
        }
        .big-btn {
            width: 100%; min-height: 88px; border-radius: var(--radius-md);
            border: none; color: #fff; font-size: 1.55rem; font-weight: 700;
            cursor: pointer; box-shadow: 0 5px 16px rgba(0,0,0,0.07);
            transition: transform 0.2s cubic-bezier(0.25,1,0.5,1), opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 12px 16px; line-height: 1.25;
        }
        .big-btn:active { transform: scale(0.97); opacity: 0.92; }
        .big-btn .btn-sub { font-size: 0.85rem; font-weight: 500; opacity: 0.9; display: block; margin-top: 2px; }

        /* ===== Modal ===== */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.48); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); z-index: 10000;
            justify-content: center; align-items: center; padding: 12px;
        }
        .modal-content {
            background: rgba(255,255,255,0.98); border: 1px solid rgba(255,255,255,0.6);
            border-radius: var(--radius-lg); width: 100%; max-width: 860px;
            padding: 28px 22px; text-align: center;
            transform: scale(0.88); max-height: 94dvh; overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.16);
            -webkit-overflow-scrolling: touch;
        }

        /* ===== 視覺影像視窗 ===== */
        .ai-vision-box {
            width: 100%; height: 320px; background: #000;
            border-radius: var(--radius-md); position: relative;
            overflow: hidden; margin: 16px 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        #v-feed, #v-feed-canvas {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); position: absolute; top: 0; left: 0;
        }
        #v-feed-canvas { z-index: 2; pointer-events: none; }
        .ai-target-circle {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 200px;
            border: 4px dashed var(--apple-red); border-radius: 50%;
            pointer-events: none; z-index: 3;
            animation: rotateDashed 20s linear infinite;
        }
        @keyframes rotateDashed {
            from { transform: translate(-50%,-50%) rotate(0deg); }
            to { transform: translate(-50%,-50%) rotate(360deg); }
        }
        .blend-meter {
            display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap;
        }
        .blend-pill {
            background: rgba(0,0,0,0.05); border-radius: 16px; padding: 6px 14px;
            font-size: 0.95rem; font-weight: 700;
        }
        .blend-pill.good { background: rgba(52,199,89,0.15); color: var(--apple-green); }
        .blend-pill.bad { background: rgba(255,59,48,0.12); color: var(--apple-red); }

        /* ===== 聲控面板 ===== */
        .thresh-panel {
            background: rgba(0,0,0,0.03); border-radius: var(--radius-md);
            padding: 14px 16px; margin: 12px 0; border: 1px solid rgba(0,0,0,0.06);
        }
        .thresh-slider {
            -webkit-appearance: none; width: 100%; height: 10px;
            border-radius: 5px; background: #d1d1d6; outline: none; margin: 10px 0;
        }
        .thresh-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 28px; height: 28px;
            border-radius: 50%; background: var(--apple-blue); cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,113,227,0.4);
        }
        .sound-meter-wrapper { position: relative; width: 100%; margin: 20px 0 10px; }
        #sound-bar-container {
            width: 100%; height: 48px; background: rgba(0,0,0,0.06);
            border-radius: 24px; position: relative; overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
        }
        #sound-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, var(--apple-green) 0%, var(--apple-orange) 70%, var(--apple-red) 100%);
            transition: width 0.05s ease-out;
        }
        #sound-val-text {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            font-weight: 800; font-size: 1.15rem; color: var(--apple-black); z-index: 5;
        }
        #sound-status-pill {
            display: inline-block; padding: 8px 18px; border-radius: 20px;
            font-size: 1rem; font-weight: 700; margin: 8px 0;
            background: rgba(0,0,0,0.05); color: var(--apple-dark-gray); transition: all 0.2s;
        }
        .score-matrix-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            margin: 12px 0; padding: 12px; background: rgba(0,0,0,0.02);
            border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06);
        }
        .score-badge {
            background: #fff; border: 2px solid rgba(0,0,0,0.08);
            border-radius: 12px; padding: 6px 2px; text-align: center; transition: all 0.25s;
        }
        .score-badge .badge-label { font-size: 0.7rem; color: var(--apple-dark-gray); font-weight: 600; }
        .score-badge .badge-value { font-size: 1rem; font-weight: 800; color: rgba(0,0,0,0.22); margin-top: 1px; }
        .score-badge.achieved {
            border-color: var(--apple-green); background: rgba(52,199,89,0.08);
            transform: translateY(-2px); box-shadow: 0 3px 8px rgba(52,199,89,0.2);
        }
        .score-badge.achieved .badge-value { color: var(--apple-green); }

        /* ===== 卡片與按鈕 ===== */
        .grid-10 {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; margin-top: 16px;
        }
        .card-unit {
            background: #fff; border: 2px solid rgba(0,0,0,0.05);
            border-radius: var(--radius-md); padding: 18px 10px;
            font-weight: 700; font-size: 1.15rem; cursor: pointer;
            transition: all 0.25s; box-shadow: 0 3px 10px rgba(0,0,0,0.02);
        }
        .card-unit:active { transform: scale(0.97); }
        .sub-btn {
            height: 56px; border-radius: var(--radius-sm); font-weight: 700;
            color: #fff; font-size: 1.05rem; border: none; cursor: pointer;
            margin: 6px; padding: 0 20px; transition: all 0.2s; min-width: 120px;
        }
        .sub-btn:active { transform: scale(0.96); }
        .sub-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .puzzle-key {
            background: #fff; border: 2px solid rgba(0,0,0,0.1);
            padding: 14px 18px; border-radius: var(--radius-sm); margin: 8px 0;
            width: 100%; text-align: left; font-size: 1.1rem; font-weight: 700;
            display: block; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .puzzle-key:active { background: var(--apple-gray); }

        /* ===== 進度與清單 ===== */
        .progress-bars { margin: 16px 0; text-align: left; }
        .prog-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .prog-label { width: 70px; font-size: 0.85rem; font-weight: 600; color: var(--apple-dark-gray); flex-shrink: 0; }
        .prog-track { flex: 1; height: 18px; background: rgba(0,0,0,0.06); border-radius: 9px; overflow: hidden; }
        .prog-fill { height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--ai-blue), var(--apple-green)); transition: width 0.5s; min-width: 2px; }
        .prog-val { width: 40px; font-size: 0.85rem; font-weight: 700; text-align: right; }

        .onboard-option {
            display: block; width: 100%; text-align: left; padding: 16px 18px;
            margin: 8px 0; border: 2px solid rgba(0,0,0,0.1); border-radius: var(--radius-sm);
            background: #fff; font-size: 1.15rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .onboard-option.selected {
            border-color: var(--apple-blue); background: rgba(0,113,227,0.06);
            box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
        }

        #toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: var(--apple-black); color: #fff; padding: 14px 24px;
            border-radius: 24px; font-size: 1.05rem; font-weight: 600;
            z-index: 30000; opacity: 0; transition: all 0.35s cubic-bezier(0.25,1,0.5,1);
            max-width: 90%; text-align: center; pointer-events: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .voice-mode-bar {
            background: linear-gradient(90deg, var(--speech-purple), var(--ai-blue));
            color: #fff; padding: 8px 16px; font-size: 0.95rem; font-weight: 700;
            text-align: center; display: none;
        }
        .voice-mode-bar.active { display: block; }

        .a11y-bar {
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
            margin-top: 10px; padding-bottom: 4px;
        }
        .a11y-btn {
            background: rgba(0,0,0,0.05); border: none; border-radius: 16px;
            padding: 6px 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
        }

        .inline-input-box {
            display: none; margin: 12px 0; padding: 14px;
            background: rgba(0,113,227,0.06); border-radius: var(--radius-sm);
            border: 2px solid var(--apple-blue);
        }
        .inline-input-box.show { display: block; }
        .inline-input-box input {
            width: 100%; font-size: 1.2rem; padding: 12px 14px;
            border-radius: 10px; border: 2px solid rgba(0,0,0,0.12); margin-bottom: 8px;
        }

        .trainer-chat {
            max-height: 280px; overflow-y: auto; text-align: left;
            background: rgba(0,0,0,0.03); border-radius: 14px; padding: 12px; margin: 10px 0;
        }
        .chat-bubble {
            margin: 8px 0; padding: 10px 14px; border-radius: 14px;
            font-size: 1rem; line-height: 1.45; max-width: 92%;
        }
        .chat-bubble.bot { background: #fff; border: 1px solid rgba(0,0,0,0.08); }
        .chat-bubble.user { background: rgba(0,113,227,0.12); margin-left: auto; text-align: right; }
        .fatigue-banner {
            display: none; background: rgba(255,149,0,0.15); color: #b36b00;
            padding: 10px 14px; border-radius: 12px; font-weight: 700; margin: 8px 0; font-size: 1rem;
        }
        .fatigue-banner.show { display: block; }
        .pause-overlay {
            display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.55);
            z-index: 10; align-items: center; justify-content: center; flex-direction: column;
            color: #fff; border-radius: var(--radius-md);
        }
        .pause-overlay.show { display: flex; }
        .home-core { display: flex; flex-direction: column; gap: 14px; width: 100%; }
        .home-free { display: none; flex-direction: column; gap: 14px; width: 100%; }
        .home-free.show { display: flex; }

        .daily-plan {
            background: linear-gradient(135deg, rgba(0,180,216,0.08), rgba(155,93,229,0.08));
            border: 1px solid rgba(0,180,216,0.2); border-radius: var(--radius-md);
            padding: 16px; margin-bottom: 8px; text-align: left;
        }
        .daily-plan h3 { margin: 0 0 8px; font-size: 1.15rem; }
        .daily-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 1rem; font-weight: 600;
        }
        .daily-item:last-child { border-bottom: none; }
        .daily-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--apple-dark-gray); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .daily-check.done { background: var(--apple-green); border-color: var(--apple-green); color: #fff; }
    </style>
</head>
<body>

<div id="toast"></div>

<!-- ===== 登入介面（免驗證碼直接進入） ===== -->
<div id="login-screen">
    <div class="login-card">
        <h1>LohasCare GeronTalk</h1>
        <p class="tagline">樂活智語 · 樂齡適應性言語復康系統</p>
        <span class="version-badge">Firebase 雲端協同版</span>
        
        <input type="text" id="case-id" placeholder="個案編號 (例如: C-101)" autocomplete="username" aria-label="個案編號" value="C-101">
        <input type="password" id="case-pw" placeholder="密碼 (預設: 1234)" autocomplete="current-password" aria-label="密碼" value="1234">
        
        <button class="big-btn" style="background:var(--apple-black); min-height:72px; font-size:1.35rem; margin-top:8px;" onclick="checkAuth()">進入系統</button>
        <p class="login-hint">測試帳號：C-101 / 1234<br>或 admin / 8888</p>
        
        <div class="a11y-bar">
            <button class="a11y-btn" onclick="adjustFont(0.1)">字體 A+</button>
            <button class="a11y-btn" onclick="adjustFont(-0.1)">字體 A−</button>
            <button class="a11y-btn" onclick="toggleContrast()">高對比</button>
        </div>
    </div>
</div>

<!-- ===== 主應用程式畫面 ===== -->
<div id="app-content">
    <div class="voice-mode-bar" id="voice-mode-bar">🎙️ 語音操作模式已開啟 — 可講「開口肌」「開聲控」「睇進度」「返回」</div>
    <header>
        <div id="time">00:00</div>
        <div class="header-meta">
            <div>個案：<span id="u-name" style="color:var(--apple-black);font-weight:700;">---</span></div>
            <div>💰 <span id="gold-val" style="color:var(--gold);font-weight:800;">0</span></div>
        </div>
        <div class="header-btns">
            <button class="apple-pill-btn primary" onclick="showProgressUI()">📊 我的進度</button>
            <button class="apple-pill-btn" onclick="manualSync()">💾 雲端同步</button>
            <button class="apple-pill-btn" id="voice-toggle-btn" onclick="toggleVoiceMode()">🎙️ 語音操作</button>
            <button class="apple-pill-btn danger" onclick="doLogout()">登出</button>
        </div>
        <div class="a11y-bar">
            <button class="a11y-btn" onclick="adjustFont(0.1)">A+</button>
            <button class="a11y-btn" onclick="adjustFont(-0.1)">A−</button>
            <button class="a11y-btn" onclick="toggleContrast()">高對比</button>
        </div>
    </header>

    <div class="nav-scroll">
        <div class="nav-grid">
            <div class="daily-plan" id="daily-plan-box">
                <h3>📋 今日建議訓練</h3>
                <div id="daily-plan-items"><p style="color:var(--apple-dark-gray);font-size:0.95rem;">載入中…</p></div>
            </div>

            <div class="home-core" id="home-core">
                <button class="big-btn" style="background:var(--apple-blue);" onclick="startDailyTraining()">
                    <span>▶️ 今日訓練<br><span class="btn-sub">個人化自適應排程 · 一鍵開始</span></span>
                </button>
                <button class="big-btn" style="background:var(--speech-purple);" onclick="toggleFreePractice()">
                    <span>📂 自由練習<br><span class="btn-sub">口肌 · 認知 · 聲控 · 情境訓練</span></span>
                </button>
                <button class="big-btn" style="background:var(--apple-green);" onclick="showProgressUI()">
                    <span>📊 我的進度<br><span class="btn-sub">趨勢分析 · 治療師報告 · 分享家人</span></span>
                </button>
                <button class="big-btn" style="background:linear-gradient(135deg,#9b5de5,#00b4d8);" onclick="showTrainerChat()">
                    <span>💬 AI 訓練夥伴<br><span class="btn-sub">粵語傾偈暖場 · 訓練回饋 · 陪伴</span></span>
                </button>
            </div>

            <div class="home-free" id="home-free">
                <button class="big-btn" style="background:var(--mouth-pink);" onclick="showMouthUI()">
                    <span>👄 口肌視覺訓練<br><span class="btn-sub">AI 動作捕捉 · 動態適應性門檻</span></span>
                </button>
                <button class="big-btn" style="background:var(--speech-purple);" onclick="showCogCatalog()">
                    <span>🗣️ 階梯認知命名<br><span class="btn-sub">漸進提示 · 語音辨識作答</span></span>
                </button>

// ---------- 自適應計算 ----------
function adaptiveThreshold(baseThreshold, history) {
    const recent = history.slice(-30);
    if (recent.length < 10) return baseThreshold;
    const passRate = recent.filter(function(s) { return s >= baseThreshold; }).length / recent.length;
    if (passRate > 0.85) return Math.min(0.90, baseThreshold + 0.05);
    if (passRate < 0.40) return Math.max(0.15, baseThreshold - 0.05);
    return baseThreshold;
}

function getAdaptiveThresh(bsType, baseThresh) {
    const key = (currentCaseId || 'Guest') + '_' + bsType;
    if (adaptiveThreshMap[key] == null) adaptiveThreshMap[key] = baseThresh;
    return adaptiveThreshMap[key];
}

function updateAdaptiveLive(bsType, baseThresh, buffer) {
    const adj = adaptiveThreshold(baseThresh, buffer);
    const key = (currentCaseId || 'Guest') + '_' + bsType;
    adaptiveThreshMap[key] = adj;
    return adj;
}

function detectFatigue(bsBuf, symBuf) {
    const recent = bsBuf.slice(-60);
    if (recent.length < 30) return { fatigue: false, level: 'low' };
    const mean = recent.reduce(function(a, b) { return a + b; }, 0) / recent.length;
    const variance = recent.reduce(function(s, v) { return s + Math.pow(v - mean, 2); }, 0) / recent.length;
    let symmetryDrop = 0;
    if (symBuf.length > 60) {
        const late = symBuf.slice(-30).reduce(function(a, b) { return a + b; }, 0) / 30;
        const early = symBuf.slice(-60, -30).reduce(function(a, b) { return a + b; }, 0) / 30;
        symmetryDrop = late - early;
    }
    const fatigue = variance > 0.05 || symmetryDrop < -0.15;
    const level = variance > 0.08 ? 'high' : (variance > 0.05 ? 'medium' : 'low');
    return { fatigue: fatigue, level: level, variance: variance, symmetryDrop: symmetryDrop };
}

const BS_MAP = {
    mouthPucker: ['mouthPucker', 'mouthFunnel'],
    mouthSmile: ['mouthSmileLeft', 'mouthSmileRight'],
    cheekPuff: ['cheekPuff'],
    jawOpen: ['jawOpen'],
    tongueOut: ['tongueOut'],
    mouthClose: ['mouthClose', 'mouthPressLeft', 'mouthPressRight'],
    mouthFrown: ['mouthFrownLeft', 'mouthFrownRight'],
    tongueUp: ['tongueOut'],
    tongueDown: ['tongueOut']
};

function getBlendScore(blendshapes, bsType) {
    if (!blendshapes || !blendshapes.length) return 0;
    const cats = blendshapes[0].categories || [];
    const names = BS_MAP[bsType] || [bsType];
    let sum = 0, count = 0;
    for (let i = 0; i < names.length; i++) {
        const n = names[i];
        const found = cats.find(function(c) { return c.categoryName.toLowerCase() === n.toLowerCase(); });
        if (found) { sum += found.score; count++; }
    }
    return count === 0 ? 0 : sum / count;
}

function calcSymmetry(blendshapes) {
    if (!blendshapes || !blendshapes.length) return 1;
    const cats = blendshapes[0].categories || [];
    const getVal = function(n) {
        const f = cats.find(function(c) { return c.categoryName === n; });
        return f ? f.score : 0;
    };
    const pairs = [
        ['mouthSmileLeft', 'mouthSmileRight'],
        ['mouthFrownLeft', 'mouthFrownRight'],
        ['eyeBlinkLeft', 'eyeBlinkRight']
    ];
    let diffs = 0, n = 0;
    for (let i = 0; i < pairs.length; i++) {
        const va = getVal(pairs[i][0]), vb = getVal(pairs[i][1]);
        if (va + vb > 0.02) { diffs += Math.abs(va - vb); n++; }
    }
    return n === 0 ? 0.95 : Math.max(0, 1 - (diffs / n) * 2);
}

function startFaceAI(bsType, idx) {
    const m = mouthData[idx];
    let timeLeft = (facePauseSnapshot && facePauseSnapshot.idx === idx) ? facePauseSnapshot.timeLeft : targetVal;
    let holdAccum = 0;
    let smoothedScore = 0;

    if (!facePauseSnapshot || facePauseSnapshot.idx !== idx) {
        blendshapeBuffer = [];
        symmetryBuffer = [];
    }
    faceRunning = true;
    facePaused = false;
    facePauseSnapshot = null;

    let liveThresh = getAdaptiveThresh(m.bs, m.thresh);
    currentMouthThresh = liveThresh;

    const btn = document.getElementById('start-face-btn');
    const pauseBtn = document.getElementById('pause-face-btn');
    if (btn) { btn.disabled = true; btn.innerText = '偵測中…'; }
    if (pauseBtn) pauseBtn.disabled = false;

    const video = document.getElementById('v-feed');
    const canvas = document.getElementById('v-feed-canvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let lastVideoTime = -1;
    let fatigueNotified = false;

    const loop = function() {
        if (!faceRunning) return;
        if (facePaused) { faceAnimId = requestAnimationFrame(loop); return; }

        if (video && video.readyState >= 2) {
            if (canvas && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            if (faceLandmarker && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const result = faceLandmarker.detectForVideo(video, performance.now());
                let rawScore = 0, sym = 0.9;

                if (result.faceBlendshapes && result.faceBlendshapes.length) {
                    rawScore = getBlendScore(result.faceBlendshapes, bsType);
                    sym = calcSymmetry(result.faceBlendshapes);
                } else {
                    rawScore = 0.5; // 模型若離線之平滑容錯
                }

                smoothedScore = smoothedScore === 0 ? rawScore : (smoothedScore * 0.7 + rawScore * 0.3);
                const score = smoothedScore;

                blendshapeBuffer.push(parseFloat(score.toFixed(3)));
                symmetryBuffer.push(parseFloat(sym.toFixed(3)));
                if (blendshapeBuffer.length > 300) blendshapeBuffer.shift();
                if (symmetryBuffer.length > 300) symmetryBuffer.shift();

                liveThresh = updateAdaptiveLive(bsType, m.thresh, blendshapeBuffer);
                currentMouthThresh = liveThresh;
                const atd = document.getElementById('adapt-thresh-disp');
                if (atd) atd.textContent = Math.round(liveThresh * 100) + '%';

                const fat = detectFatigue(blendshapeBuffer, symmetryBuffer);
                const fb = document.getElementById('fatigue-banner');
                if (fat.fatigue && fb) {
                    fb.classList.add('show');
                    if (!fatigueNotified) {
                        fatigueNotified = true;
                        liveThresh = Math.max(0.15, liveThresh - 0.08);
                        currentMouthThresh = liveThresh;
                        speak('放鬆飲啖水先，我已經為你調低咗門檻');
                    }
                }

                const bsEl = document.getElementById('bs-score');
                const syEl = document.getElementById('sym-score');
                if (bsEl) {
                    bsEl.textContent = '強度：' + Math.round(score * 100) + '%';
                    bsEl.className = 'blend-pill ' + (score >= liveThresh ? 'good' : 'bad');
                }
                if (syEl) {
                    syEl.textContent = '對稱度：' + Math.round(sym * 100) + '%';
                    syEl.className = 'blend-pill ' + (sym >= 0.7 ? 'good' : 'bad');
                }

                if (ctx && result.faceLandmarks && result.faceLandmarks.length) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = score >= liveThresh ? 'rgba(52,199,89,0.7)' : 'rgba(255,59,48,0.5)';
                    for (let p = 0; p < result.faceLandmarks[0].length; p++) {
                        const pt = result.faceLandmarks[0][p];
                        ctx.beginPath();
                        ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (score >= liveThresh) {
                    holdAccum += 1 / 30;
                    if (holdAccum >= 1) {
                        holdAccum -= 1;
                        timeLeft--;
                        window._faceTimeLeft = timeLeft;
                        const tDisp = document.getElementById('timer-disp');
                        if (tDisp) tDisp.innerText = '保持中：' + timeLeft + ' 秒';
                        const stat = document.getElementById('ai-stat');
                        if (stat) stat.innerText = '✅ 動作做得好，請繼續保持！';
                    }
                } else {
                    const stat = document.getElementById('ai-stat');
                    if (stat) stat.innerText = '❌ 請對準畫面並用力做出動作';
                }

                if (timeLeft <= 0) {
                    faceRunning = false;
                    stopFaceCam();
                    currentTrainingType = '口肌訓練：' + m.n;
                    const avgBS = blendshapeBuffer.length ? (blendshapeBuffer.reduce(function(a, b) { return a + b; }, 0) / blendshapeBuffer.length) : 0;
                    const avgSym = symmetryBuffer.length ? (symmetryBuffer.reduce(function(a, b) { return a + b; }, 0) / symmetryBuffer.length) : 0;
                    
                    addGold(50);
                    markDaily('mouth');
                    addHistory('口肌：' + m.n, 50, [Math.round(avgBS * 100), Math.round(avgSym * 100)], m.bs, {
                        avgBS: avgBS, avgSym: avgSym, finalThresh: liveThresh
                    });
                    showMouthResult(m.n, avgBS, avgSym, liveThresh);
                    return;
                }
            }
        }
        faceAnimId = requestAnimationFrame(loop);
    };
    faceAnimId = requestAnimationFrame(loop);
    speak('開始偵測，請做出動作並維持住');
}

function pauseFaceAI() {
    if (!faceRunning) return;
    facePaused = true;
    facePauseSnapshot = {
        idx: currentMouthIdx,
        timeLeft: window._faceTimeLeft != null ? window._faceTimeLeft : targetVal
    };
    const ov = document.getElementById('pause-overlay');
    if (ov) ov.classList.add('show');
    toast('已暫停，隨時可以繼續');
}

function resumeFaceAI() {
    facePaused = false;
    const ov = document.getElementById('pause-overlay');
    if (ov) ov.classList.remove('show');
    speak('繼續維持動作');
}

function stopFaceCam() {
    faceRunning = false;
    facePaused = false;
    if (faceAnimId) { cancelAnimationFrame(faceAnimId); faceAnimId = null; }
    if (faceCamStream) {
        faceCamStream.getTracks().forEach(function(t) { t.stop(); });
        faceCamStream = null;
    }
}

        '<div id="game-stage" style="font-size:4.5rem;margin:8px 0;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);">' + (type === 'voice' ? '🌱' : '☁️') + '</div>' +
        '<div class="sound-meter-wrapper">' +
            '<div id="sound-bar-container"><div id="sound-bar-fill"></div><div id="sound-val-text">0%</div></div>' +
        '</div>' +
        '<div id="sound-status-pill">⚪ 點擊下方啟動麥克風</div>' +
        '<div class="score-matrix-grid">' + badges + '</div>' +
        '<p id="v-info" style="font-size:1.2rem;font-weight:800;margin:8px 0;">達標進度：0 / 10 次</p>' +
        '<div style="display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap;">' +
            '<button class="sub-btn" style="background:var(--apple-blue);min-width:180px;" onclick="startAudioGame(\'' + type + '\')">🎙️ 啟動收音訓練</button>' +
            '<button class="sub-btn" style="background:var(--apple-black);min-width:120px;" onclick="closeAll()">返回主頁</button>' +
        '</div>'
    );
}

function updateThresholdLive(rate) {
    soundTargetThreshold = parseInt(rate);
    soundResetThreshold = Math.round(soundTargetThreshold * 0.5);
    const tDisp = document.getElementById('t-val-disp');
    const rDisp = document.getElementById('r-val-disp');
    if (tDisp) tDisp.innerText = soundTargetThreshold;
    if (rDisp) rDisp.innerText = soundResetThreshold;
}

async function startAudioGame(type) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        audioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.3;

        const source = audioCtx.createMediaStreamSource(audioStream);
        source.connect(analyser);

        let count = 0, canTrigger = true;
        const data = new Uint8Array(analyser.frequencyBinCount);
        const statusPill = document.getElementById('sound-status-pill');
        toast('收音中，請開始發聲或吹氣！');

        const loop = function() {
            if (!analyser || !document.getElementById('sound-bar-fill')) return;
            analyser.getByteFrequencyData(data);
            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i];
            const avg = sum / data.length;
            const level = Math.min(100, Math.round((avg / 110) * 100));

            document.getElementById('sound-bar-fill').style.width = level + '%';
            document.getElementById('sound-val-text').innerText = level + '%';

            if (level >= soundTargetThreshold && canTrigger) {
                count++;
                canTrigger = false;
                recordedScores.push(level);
                const badge = document.getElementById('badge-' + count);
                const valEl = document.getElementById('val-' + count);
                if (badge) badge.classList.add('achieved');
                if (valEl) valEl.innerText = level + '%';
                if (statusPill) {
                    statusPill.style.color = 'var(--apple-green)';
                    statusPill.innerText = '🎉 第 ' + count + ' 次達標！';
                }
                document.getElementById('v-info').innerText = '達標進度：' + count + ' / 10 次';
                
                const stage = document.getElementById('game-stage');
                if (stage) stage.style.transform = 'scale(' + (1 + count * 0.08) + ')';

                if (count >= 10) {
                    stopAudioGame();
                    if (stage) stage.innerText = type === 'voice' ? '🌸' : '🎈';
                    addGold(100);
                    markDaily(type === 'voice' ? 'voice' : 'blow');
                    addHistory(type === 'voice' ? '聲控發聲' : '呼吸氣量', 100, recordedScores);
                    speak('太厲害喇！連續達標十次，獲得一百金幣！');
                    toast('🏆 訓練完成！+100 金幣已存入雲端');
                    return;
                }
            } else if (level <= soundResetThreshold && !canTrigger) {
                canTrigger = true;
                if (statusPill) {
                    statusPill.style.color = 'var(--apple-dark-gray)';
                    statusPill.innerText = '💨 換氣完成，請發出下一次聲音';
                }
            }
            audioLoopId = requestAnimationFrame(loop);
        };
        audioLoopId = requestAnimationFrame(loop);
    } catch (e) {
        toast('無法開啟麥克風，請檢查權限');
    }
}

function stopAudioGame() {
    if (audioLoopId) { cancelAnimationFrame(audioLoopId); audioLoopId = null; }
    if (audioStream) { audioStream.getTracks().forEach(function(t) { t.stop(); }); audioStream = null; }
}

// ---------- 語音作答與回退 ----------
function listenOnce(callback) {
    listenCallback = callback;
    if (!recognizer) {
        showInlineSpeechInput();
        return;
    }
    try {
        recognizer.onresult = function(e) {
            hideInlineSpeechInput();
            callback(e.results[0][0].transcript);
        };
        recognizer.onerror = function() { showInlineSpeechInput(); };
        recognizer.start();
        toast('🎙️ 請開始說話…');
    } catch (e) {
        showInlineSpeechInput();
    }
}

function showInlineSpeechInput() {
    let box = document.getElementById('inline-speech-box');
    if (!box) {
        const body = document.getElementById('modal-body');
        if (!body) return;
        box = document.createElement('div');
        box.id = 'inline-speech-box';
        box.className = 'inline-input-box show';
        box.innerHTML = '<p style="font-weight:700;margin:0 0 8px;text-align:left;">✍️ 鍵盤輸入替代語音：</p>' +
            '<input type="text" id="inline-speech-val" placeholder="請在此輸入答案">' +
            '<button class="sub-btn" style="background:var(--apple-blue);width:100%;height:48px;" onclick="submitInlineSpeech()">送出確認</button>';
        body.appendChild(box);
    } else {
        box.classList.add('show');
    }
}

function hideInlineSpeechInput() {
    const box = document.getElementById('inline-speech-box');
    if (box) box.classList.remove('show');
}

function submitInlineSpeech() {
    const val = document.getElementById('inline-speech-val').value.trim();
    hideInlineSpeechInput();
    if (listenCallback) listenCallback(val);
    listenCallback = null;
}

// ---------- 語音全域導航 ----------
function toggleVoiceMode() {
    if (voiceModeActive) stopVoiceMode();
    else startVoiceMode();
}

function startVoiceMode() {
    if (!recognizer) { toast('此瀏覽器不支援語音控制指令'); return; }
    voiceModeActive = true;
    document.getElementById('voice-mode-bar').classList.add('active');
    document.getElementById('voice-toggle-btn').classList.add('primary');
    toast('語音指令已啟動');
    speak('語音操作已開啟，你可以講開口肌、開聲控或睇進度');
    loopVoiceCommand();
}

function stopVoiceMode() {
    voiceModeActive = false;
    document.getElementById('voice-mode-bar').classList.remove('active');
    document.getElementById('voice-toggle-btn').classList.remove('primary');
}

function loopVoiceCommand() {
    if (!voiceModeActive || !recognizer) return;
    try {
        const r = new SpeechRec();
        r.lang = 'zh-HK';
        r.onresult = function(e) {
            const t = (e.results[0][0].transcript || '').replace(/\s/g, '');
            handleVoiceCmd(t);
            setTimeout(loopVoiceCommand, 800);
        };
        r.onerror = function() { setTimeout(loopVoiceCommand, 1500); };
        r.onend = function() { if (voiceModeActive) setTimeout(loopVoiceCommand, 600); };
        r.start();
    } catch (_) {
        setTimeout(loopVoiceCommand, 2000);
    }
}

function handleVoiceCmd(t) {
    if (/今日訓練|開始訓練/.test(t)) { closeAll(); startDailyTraining(); }
    else if (/口肌|嘴巴/.test(t)) { closeAll(); showMouthUI(); }
    else if (/聲控|開花/.test(t)) { closeAll(); showGameUI('voice'); }
    else if (/吹氣|氣量/.test(t)) { closeAll(); showGameUI('blow'); }
    else if (/進度|報告/.test(t)) { showProgressUI(); }
    else if (/返回|主頁/.test(t)) { closeAll(); }
}

    );
}

async function toggleLifeRec(id) {
    const btn = document.getElementById('rec-btn');
    const status = document.getElementById('life-status');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        btn.innerText = '⏺ 開始錄音';
        status.innerText = '處理中…';
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function(e) { if (e.data.size) recordedChunks.push(e.data); };
        mediaRecorder.onstop = function() {
            stream.getTracks().forEach(function(t) { t.stop(); });
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            lifeRecordings[id] = { blobUrl: url, date: new Date().toISOString() };
            const audio = document.getElementById('life-audio');
            if (audio) { audio.src = url; audio.style.display = 'block'; }
            status.innerText = '✅ 錄音完成，已存入進度紀錄';
            addGold(20);
            addHistory('生活錄音：' + id, 20);
            toast('錄音成功！+20 金幣');
            speak('錄音完成，做得好！');
        };
        mediaRecorder.start();
        btn.innerText = '⏹ 停止錄音';
        status.innerText = '🔴 錄音中，請大聲讀出句子…';
    } catch (e) {
        toast('無法開啟麥克風進行錄音');
    }
}

function playLifePrev(id) {
    const prev = lifeRecordings[id];
    if (!prev) return;
    const audio = document.getElementById('life-audio');
    if (audio) { audio.src = prev.blobUrl; audio.style.display = 'block'; audio.play(); }
}
