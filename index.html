<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>『樂活金掌家』- 旗艦級 AI 言語治療系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <style>
        :root {
            /* Apple 經典色系與 Oasis 自然色調融合 */
            --apple-black: #1d1d1f;
            --apple-gray: #f5f5f7;
            --apple-dark-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
            
            /* Oasis 療癒色調 */
            --ts-bg: #f2f5f3; 
            --paper: rgba(255, 255, 255, 0.95);
            --gold: #c6a052;
            --speech-purple: #9b5de5;
            --mouth-pink: #ff99b6;
            --ai-blue: #00b4d8;
            
            /* 圓角規範 */
            --radius-sm: 14px;
            --radius-md: 24px;
            --radius-lg: 36px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang HK", "Microsoft JhengHei", sans-serif;
            letter-spacing: -0.02em;
        }

        body { 
            background: var(--ts-bg); 
            margin: 0;
            color: var(--apple-black); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 1. 登入介面 - Apple 毛玻璃極簡風格 */
        #login-screen { 
            position: fixed;
            inset: 0; 
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, var(--ts-bg) 100%);
            z-index: 20000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 24px;
        }
        
        .login-card { 
            background: var(--paper); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 48px; 
            border-radius: var(--radius-lg); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center; 
            width: 100%; 
            max-width: 560px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        .login-card h1 {
            font-size: 50px;
            font-weight: 700;
            color: var(--apple-black);
            margin: 0 0 12px 0;
            letter-spacing: -0.03em;
        }

        .login-card p {
            font-size: 22px;
            color: var(--apple-dark-gray);
            margin: 0 0 32px 0;
            font-weight: 500;
        }

        .login-card input { 
            font-size: 24px; 
            width: 100%; 
            padding: 18px 24px; 
            margin-bottom: 18px;
            border-radius: var(--radius-sm); 
            border: 2px solid rgba(0,0,0,0.12); 
            background: rgba(255, 255, 255, 0.9);
            outline: none; 
            transition: all 0.3s ease;
        }

        .login-card input:focus {
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        #v-box { 
            background: var(--apple-black); 
            color: white;
            padding: 14px; 
            letter-spacing: 10px; 
            font-size: 32px; 
            margin: 6px 0 20px 0; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            font-weight: 700; 
            text-align: center; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        
        /* 2. 導覽主佈局 */
        header { 
            background: var(--paper);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.08); 
            padding: 24px; 
            text-align: center; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
        }

        #app-content { 
            display: none;
            flex-direction: column; 
            flex: 1; 
            overflow-y: auto; 
        }

        .nav-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            padding: 32px 24px; 
            align-items: center; 
            max-width: 650px; 
            width: 100%; 
            margin: 0 auto;
        }

        /* 長者親善超重磅按鈕 */
        .big-btn { 
            width: 100%; 
            height: 100px;
            border-radius: var(--radius-md); 
            border: none; 
            color: white; 
            font-size: 32px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .big-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        
        /* 3. 智慧彈窗與 AI 控制區 */
        .modal { 
            display: none;
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.45); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10000; 
            justify-content: center; 
            align-items: center;
            padding: 20px;
        }

        .modal-content { 
            background: rgba(255, 255, 255, 0.98); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-lg); 
            width: 100%;
            max-width: 860px; 
            padding: 40px; 
            text-align: center; 
            transform: scale(0.85); 
            max-height: 94vh; 
            overflow-y: auto;
            box-shadow: 0 35px 70px rgba(0,0,0,0.18);
        }
        
        .ai-vision-box { 
            width: 100%;
            height: 400px; 
            background: #000; 
            border-radius: var(--radius-md); 
            position: relative; 
            overflow: hidden; 
            margin: 24px 0;
            box-shadow: inset 0 0 24px rgba(0,0,0,0.3);
        }

        #v-feed { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
        }

        .ai-target-circle { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 240px; 
            height: 240px; 
            border: 5px dashed var(--apple-red); 
            border-radius: 50%; 
            pointer-events: none;
            animation: rotateDashed 25s linear infinite;
        }

        @keyframes rotateDashed {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #nose-dot { 
            position: absolute; 
            width: 22px; 
            height: 22px; 
            background: var(--apple-green); 
            border: 4px solid white;
            border-radius: 50%;
            display: none; 
            z-index: 5; 
            box-shadow: 0 0 12px rgba(52, 199, 89, 0.6);
        }
        
        /* 4. 聲控與氣量阻抗專用儀錶與矩陣樣式 */
        .sound-meter-wrapper {
            position: relative;
            width: 100%;
            margin: 28px 0 12px 0;
        }

        #sound-bar-container { 
            width: 100%;
            height: 52px; 
            background: rgba(0,0,0,0.06); 
            border-radius: 26px; 
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
        }

        #sound-bar-fill { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, var(--apple-green) 0%, var(--apple-orange) 70%, var(--apple-red) 100%);
            transition: width 0.06s ease-out; 
        }

        #sound-val-text { 
            position: absolute; 
            right: 22px; 
            top: 50%;
            transform: translateY(-50%); 
            font-weight: 800; 
            font-size: 22px; 
            color: var(--apple-black); 
            z-index: 5;
        }

        .threshold-marker-80 {
            position: absolute;
            left: 80%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--apple-red);
            z-index: 4;
        }
        .threshold-marker-80::after {
            content: "80% 達標線";
            position: absolute;
            top: -24px;
            right: -32px;
            font-size: 13px;
            font-weight: 700;
            color: var(--apple-red);
        }

        .threshold-marker-40 {
            position: absolute;
            left: 40%;
            top: 0;
            bottom: 0;
            width: 2px;
            border-left: 2px dashed rgba(0,0,0,0.35);
            z-index: 4;
        }
        .threshold-marker-40::after {
            content: "40% 換氣重置";
            position: absolute;
            bottom: -22px;
            left: -32px;
            font-size: 13px;
            font-weight: 600;
            color: var(--apple-dark-gray);
        }

        #sound-status-pill {
            display: inline-block;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            margin: 10px 0;
            background: rgba(0,0,0,0.05);
            color: var(--apple-dark-gray);
            transition: all 0.2s ease;
        }

        .score-matrix-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 16px 0;
            padding: 16px;
            background: rgba(0,0,0,0.02);
            border-radius: var(--radius-md);
            border: 1px solid rgba(0,0,0,0.06);
        }

        .score-badge {
            background: white;
            border: 2px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            transition: all 0.25s ease;
        }

        .score-badge .badge-label {
            font-size: 13px;
            color: var(--apple-dark-gray);
            font-weight: 600;
        }

        .score-badge .badge-value {
            font-size: 20px;
            font-weight: 800;
            color: rgba(0,0,0,0.25);
            margin-top: 2px;
        }

        .score-badge.achieved {
            border-color: var(--apple-green);
            background: rgba(52, 199, 89, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 199, 89, 0.2);
        }

        .score-badge.achieved .badge-value {
            color: var(--apple-green);
        }
        
        /* 5. 網格元件排版 */
        .grid-10 { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); 
            gap: 18px; 
            margin-top: 24px; 
        }

        .card-unit { 
            background: white;
            border: 2px solid rgba(0,0,0,0.05); 
            border-radius: var(--radius-md); 
            padding: 24px 16px; 
            font-weight: 700; 
            font-size: 24px; 
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.02);
        }

        .card-unit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.07);
            border-color: rgba(0,0,0,0.08);
        }

        .sub-btn { 
            height: 62px; 
            border-radius: var(--radius-sm); 
            font-weight: 700; 
            color: white; 
            font-size: 20px;
            border: none; 
            cursor: pointer; 
            margin: 8px; 
            padding: 0 28px; 
            transition: all 0.2s ease;
        }

        .sub-btn:active { transform: scale(0.96); }

        .puzzle-key { 
            background: white;
            border: 2px solid rgba(0,0,0,0.12); 
            padding: 18px 24px; 
            border-radius: var(--radius-sm); 
            margin: 12px 0; 
            width: 100%; 
            text-align: left; 
            font-size: 22px; 
            font-weight: 700; 
            display: block; 
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
        }

        .puzzle-key:hover {
            background: var(--apple-gray);
            border-color: rgba(0,0,0,0.2);
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 850px;
            margin: 14px auto 0 auto;
            font-size: 22px;
            color: var(--apple-dark-gray);
            font-weight: 600;
        }

        .header-btns { margin-top: 18px; }

        .apple-pill-btn {
            background: rgba(0,0,0,0.06);
            color: var(--apple-black);
            padding: 12px 24px;
            font-size: 19px;
            border-radius: 24px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin: 0 8px;
            transition: all 0.2s ease;
        }

        .apple-pill-btn:hover { background: rgba(0,0,0,0.1); }
        .apple-pill-btn.primary { background: var(--apple-blue); color: white; }
    </style>
</head>
<body>

<!-- 登入介面 -->
<div id="login-screen">
    <div class="login-card">
        <h1>樂活金掌家</h1>
        <p>AI 言語治療專業訓練系統</p>
        <input type="text" id="case-id" placeholder="個案編號 (例如: C-101)">
        <input type="password" id="case-pw" placeholder="密碼 (預設: 1234)">
        <div id="v-box" onclick="refreshV()">8888</div>
        <input type="text" id="v-in" placeholder="請輸入上方驗證碼" style="text-align:center;">
        <button class="big-btn" style="background:var(--apple-black); height:80px; font-size:26px;" onclick="checkAuth()">驗證進入系統</button>
    </div>
</div>

<!-- 主應用介面 -->
<div id="app-content">
    <header>
        <div id="time" style="font-size: 52px; font-weight: 800; color: var(--apple-black); letter-spacing: -0.04em;">00:00</div>
        <div class="header-meta">
            <div>個案：<span id="u-name" style="color:var(--apple-black); font-weight:700;">---</span></div>
            <div>💰 累計金幣：<span id="gold-val" style="color:var(--gold); font-weight:800;">0</span></div>
        </div>
        <div class="header-btns">
            <button class="apple-pill-btn primary" onclick="syncMongoDB()">💾 手動同步紀錄</button>
            <button class="apple-pill-btn" onclick="location.reload()">🚪 登出系統</button>
        </div>
    </header>
    
    <div class="nav-grid">
        <button class="big-btn" style="background:var(--mouth-pink);" onclick="showMouthUI()">👄 口肌視覺訓練</button>
        <button class="big-btn" style="background:var(--speech-purple);" onclick="showCogCatalog()">🗣️ 階梯認知命名</button>
        <button class="big-btn" style="background:var(--ai-blue);" onclick="showSceneCatalog()">📍 真實情境應對</button>
        <button class="big-btn" style="background:var(--apple-green);" onclick="showGameUI('voice')">🎵 聲控開花 (發聲)</button>
        <button class="big-btn" style="background:var(--ai-blue);" onclick="showGameUI('blow')">🎈 氣量脹大 (吹氣)</button>
    </div>
</div>

<!-- 通用彈窗容器 -->
<div id="modal-container" class="modal">
    <div class="modal-content" id="modal-body"></div>
</div>

<script>
    // --- 全局狀態變數 ---
    let usersData = {
        "C-101": { name: "陳伯伯", pw: "1234", gold: 120 },
        "C-102": { name: "李婆婆", pw: "1234", gold: 250 },
        "admin": { name: "治療師示範帳號", pw: "8888", gold: 999 }
    }; 
    let currentUser = null, goldCount = 0, vCodeStr = "";
    let targetVal = 10, cameraStream = null, aiTimer = null;
    
    // Web Audio 專用變數
    let audioCtx = null, analyser = null, audioStream = null, audioLoopId = null;
    let recordedScores = []; // 儲存 10 次達標強度原始數據

    // 🎯 GAS 雙向同步雲端 API 位置
    const API_GET_URL = "https://script.google.com/macros/s/AKfycbwjzTSM9D_CGHDYRUBJxuFJ4xgOxsOgrbRWzHSoTL2NO3-C0TZJny_vXz2UORbpCbM7kQ/exec";
    const API_POST_URL = "https://script.google.com/macros/s/AKfycbzP0aXpxzQn5sz0zF15nSKx73QbxDl9xp83-653X-hcE2MuzUmzxAf1cuJeJZN70S3N/exec";
    
    // 🎯 Dify 高級工作流 API 位置與 Key 設定
    const DIFY_WORKFLOW_URL = "https://api.dify.ai/v1/workflows/run";
    const DIFY_API_KEY = "Bearer app-YOUR_ACTUAL_DIFY_API_KEY"; 
    
    let currentTrainingType = "未分類訓練";
    let lastGoldEarned = 0;

    let blendshapeBuffer = [];
    let symmetryBuffer = [];

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognizer = SpeechRec ? new SpeechRec() : null;
    if(recognizer) { recognizer.lang = 'zh-HK'; recognizer.continuous = false; }

    function loadUsersFromCloud() {
        console.log("🔄 正在連線雲端提取最新長者名單...");
        fetch(API_GET_URL)
            .then(response => response.json())
            .then(data => {
                if (data && typeof data === 'object') {
                    usersData = Object.assign(usersData, data);
                    console.log("✅ 雲端名單提取成功！目前個案庫數量：", Object.keys(usersData).length);
                }
            })
            .catch(err => {
                console.warn("⚠️ 雲端名單讀取異常，已自動切換為本地預設個案名單 (C-101 / 1234)", err);
            });
    }

    function refreshV() { 
        vCodeStr = Math.floor(1000 + Math.random() * 9000).toString(); 
        document.getElementById('v-box').innerText = vCodeStr; 
    }
    
    function checkAuth() {
        const id = document.getElementById('case-id').value.trim();
        const pw = document.getElementById('case-pw').value.trim();
        const vin = document.getElementById('v-in').value.trim();
        
        if (usersData[id] && usersData[id].pw === pw && vin === vCodeStr) {
            currentUser = usersData[id];
            goldCount = currentUser.gold || 0; 
            document.getElementById('u-name').innerText = currentUser.name;
            document.getElementById('gold-val').innerText = goldCount;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
            speak("身份驗證成功，歡迎進入樂活金掌家系統。");
        } else { 
            alert("登入失敗！\n提示：可使用預設帳號 C-101 / 密碼 1234 進行測試。"); 
            refreshV(); 
        }
    }

    // ==========================================
    // 1. 口肌視覺訓練與 Dify AI 深度評估
    // ==========================================
    const mouthData = [
        {n:"噘嘴", i:"😙", bs:"mouthPucker", d:"雙唇用力向前翹起"}, {n:"咧嘴", i:"😊", bs:"mouthSmile", d:"嘴角向兩邊拉開"},
        {n:"鼓腮", i:"😗", bs:"cheekPuff", d:"兩頰充滿空氣撐開"}, {n:"張大口", i:"😲", bs:"jawOpen", d:"下巴放鬆，盡量張大"},
        {n:"舌伸出", i:"👅", bs:"tongueOut", d:"舌頭盡量向正前方伸"}, {n:"抿嘴", i:"😐", bs:"mouthClose", d:"雙唇用力閉緊"},
        {n:"魚臉", i:"😚", bs:"mouthFrown", d:"兩頰向內吸做出魚嘴"}, {n:"舌向上", i:"⬆️", bs:"tongueUp", d:"舌尖向上觸碰上唇"},
        {n:"舌向下", i:"⬇️", bs:"tongueDown", d:"舌尖向下延伸"}, {n:"露齒", i:"😬", bs:"mouthSmile", d:"咬緊牙關用力橫拉"}
    ];

    function showMouthUI() {
        setModal(`
            <h2 style="font-size:36px; margin-bottom:16px;">👄 AI 口肌視覺訓練</h2>
            <p style="font-size:22px; color:var(--apple-dark-gray);">請設定目標秒數</p>
            <div style="margin-bottom:26px;">
                ${[10,20,30].map(s => `<button class="sub-btn" style="width:130px; background:${targetVal==s?'var(--apple-black)':'var(--apple-dark-gray)'};" onclick="targetVal=${s};showMouthUI()">${s}秒</button>`).join('')}
            </div>
            <div class="grid-10">
                ${mouthData.map((m, idx) => `<div class="card-unit" onclick="openMouthAI(${idx})"><span style="font-size:60px; display:block; margin-bottom:8px;">${m.i}</span>${m.n}</div>`).join('')}
            </div>
            <button class="sub-btn" style="background:var(--apple-black); width:100%; margin-top:32px; height:64px;" onclick="closeAll()">返回主頁</button>
        `);
    }

    async function openMouthAI(idx) {
        const m = mouthData[idx];
        setModal(`
            <h2 style="font-size:38px; margin-bottom:8px;">${m.n}</h2>
            <div style="font-size:100px; margin:10px 0;">${m.i}</div>
            <p id="timer-disp" style="font-size:30px; font-weight:800; color:var(--apple-red); margin:0;">目標：${targetVal} 秒</p>
            <div class="ai-vision-box"><video id="v-feed" autoplay playsinline></video><div class="ai-target-circle"></div><div id="nose-dot"></div></div>
            <p id="ai-stat" style="font-size:24px; color:var(--apple-dark-gray); font-weight:700;">📸 AI 偵測準備中...</p>
            <div style="margin-top:24px;">
                <button class="sub-btn" style="background:var(--apple-blue);" onclick="startFaceAI('${m.bs}', ${idx})">開啟鏡頭感應</button>
                <button class="sub-btn" style="background:var(--gold);" onclick="speak('${m.d}')">動作提示</button>
                <button class="sub-btn" style="background:var(--apple-dark-gray);" onclick="showMouthUI()">返回目錄</button>
            </div>`);
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({video: {width:640, height:480}});
            document.getElementById('v-feed').srcObject = cameraStream;
        } catch (e) {
            console.warn("鏡頭存取失敗", e);
            document.getElementById('ai-stat').innerText = "⚠️ 請確認已允許瀏覽器使用視訊鏡頭";
        }
    }

    function startFaceAI(bsType, idx) {
        const m = mouthData[idx];
        let timeLeft = targetVal;
        blendshapeBuffer = [];
        symmetryBuffer = [];

        if(aiTimer) clearInterval(aiTimer);

    async function startAudioGame(type) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.3;

            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(audioStream);
            source.connect(analyser);

            let count = 0;
            let canTrigger = true; 
            let currentPeak = 0;
            const data = new Uint8Array(analyser.frequencyBinCount);

            const statusPill = document.getElementById('sound-status-pill');

            const loop = () => {
                if (!analyser || !document.getElementById('sound-bar-fill')) return;

                analyser.getByteFrequencyData(data);
                
                const average = data.reduce((sum, val) => sum + val, 0) / data.length;
                const level = Math.min(100, Math.round((average / 128) * 100));

                document.getElementById('sound-bar-fill').style.width = level + "%";
                document.getElementById('sound-val-text').innerText = level + "%";

                if (level > currentPeak) {
                    currentPeak = level;
                }

                // 🎯 1. 達標判定 (>= 80% 且可觸發)
                if (level >= 80 && canTrigger) {
                    count++;
                    canTrigger = false; 
                    const achievedPeak = Math.max(level, currentPeak);
                    recordedScores.push(achievedPeak);

                    const targetBadge = document.getElementById(`badge-${count}`);
                    const targetValText = document.getElementById(`val-${count}`);
                    if (targetBadge && targetValText) {
                        targetBadge.classList.add('achieved');
                        targetValText.innerText = achievedPeak + "%";
                    }

                    if (statusPill) {
                        statusPill.style.background = "rgba(52, 199, 89, 0.15)";
                        statusPill.style.color = "var(--apple-green)";
                        statusPill.innerText = `🎉 第 ${count} 次達標！強度：${achievedPeak}%`;
                    }
                    document.getElementById('v-info').innerText = `已達成：${count} / 10 次`;

                    if (type === 'blow') {
                        document.getElementById('game-stage').style.transform = `scale(${1 + count * 0.08})`;
                    } else {
                        document.getElementById('game-stage').style.transform = `scale(${1 + (count % 3) * 0.15})`;
                    }

                    if (count >= 10) {
                        stopAudioGame();
                        document.getElementById('game-stage').innerText = type === 'voice' ? '🌸' : '🎈';
                        document.getElementById('game-stage').style.transform = 'scale(1.4)';
                        if (statusPill) statusPill.innerText = "🏆 恭喜！順利完成 10 次訓練！";
                        
                        currentTrainingType = (type === 'voice' ? '聲控發聲 (10次達標)' : '氣量阻抗 (10次達標)');
                        lastGoldEarned = 100;
                        addGold(100);
                        speak("太叻喇！成功完成十次達標訓練！獲得一百金幣！");
                        syncMongoDB();
                        return;
                    }
                } 
                // 🔄 2. 換氣防抖重置 (<= 40% 且已鎖定)
                else if (level <= 40 && !canTrigger) {
                    canTrigger = true;
                    currentPeak = 0; 
                    if (statusPill) {
                        statusPill.style.background = "rgba(0,0,0,0.05)";
                        statusPill.style.color = "var(--apple-dark-gray)";
                        statusPill.innerText = "💨 換氣完成，請再次發聲/吹氣";
                    }
                }

                audioLoopId = requestAnimationFrame(loop);
            };

            audioLoopId = requestAnimationFrame(loop);
        } catch (err) {
            console.error("無法開啟麥克風：", err);
            alert("無法存取麥克風，請確認瀏覽器已允許麥克風權限。");
        }
    }

    function stopAudioGame() {
        if (audioLoopId) {
            cancelAnimationFrame(audioLoopId);
            audioLoopId = null;
        }
        if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
            audioStream = null;
        }
    }

    // ==========================================
    // 5. 通用視窗工具與後端同步
    // ==========================================
    function setModal(h) { 
        const container = document.getElementById('modal-container');
        const body = document.getElementById('modal-body');
        container.style.display = 'flex'; 
        body.innerHTML = h; 
        setTimeout(() => { 
            body.style.transform = 'scale(1)'; 
            body.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)'; 
        }, 10);
    }
    
    function closeAll() { 
        document.getElementById('modal-container').style.display = 'none'; 
        if(cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; } 
        if(aiTimer) { clearInterval(aiTimer); aiTimer = null; }
        stopAudioGame();
        window.speechSynthesis.cancel();
    }
    
    function addGold(n) { 
        goldCount += n; 
        document.getElementById('gold-val').innerText = goldCount; 
    }

    function speak(t) { 
        try {
            window.speechSynthesis.cancel(); 
            let s = new SpeechSynthesisUtterance(t); 
            s.lang = 'zh-HK'; 
            s.rate = 0.9; // 語速微調，更適合長者聽覺
            window.speechSynthesis.speak(s); 
        } catch(e) {
            console.warn("TTS 發音失敗", e);
        }
    }
    
    // GAS 雲端大數據試算表寫入連動 (支援 10 次達標強度陣列)
    function syncMongoDB() { 
        console.log("📊 數據傳輸核心：同步雲端試算表記錄中..."); 
        const caseIdInput = document.getElementById('case-id');
        const caseId = caseIdInput ? (caseIdInput.value.trim() || "Guest") : "Guest";
        const name = currentUser ? currentUser.name : "訪客";

        const avgScore = recordedScores.length > 0 
            ? Math.round(recordedScores.reduce((a, b) => a + b, 0) / recordedScores.length) 
            : "";

        const payload = {
            caseId: caseId,
            name: name,
            trainingType: currentTrainingType,
            goldEarned: lastGoldEarned,
            totalGold: goldCount,
            recordedScores: recordedScores,               // 傳遞原始陣列
            scoresSummary: recordedScores.join(", "),     // 試算表直接閱讀字串
            avgIntensity: avgScore                        // 平均發聲強度
        };

        fetch(API_POST_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            console.log("📈 雲端同步完成，成功上傳強度數據：", payload.recordedScores);
            lastGoldEarned = 0; 
            recordedScores = []; 
        })
        .catch(err => {
            console.error("❌ 雲端儲存錯誤:", err);
        });
    }

    window.onload = function() {
        refreshV();
        loadUsersFromCloud(); 
        setInterval(() => document.getElementById('time').innerText = new Date().toTimeString().slice(0,5), 1000);
    };
</script>
