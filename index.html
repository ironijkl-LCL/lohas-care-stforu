<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>『樂活金掌家』- 旗艦級 AI 言語治療系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <style>
        :root {
            /* Apple 經典色系與 Oasis 自然色調融合 */
            --apple-black: #1d1d1f;
            --apple-gray: #f5f5f7;
            --apple-dark-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            
            /* Oasis 療癒色調 */
            --ts-bg: #f2f5f3; 
            --paper: rgba(255, 255, 255, 0.9);
            --gold: #c6a052;
            --speech-purple: #9b5de5;
            --mouth-pink: #ff99b6;
            --ai-blue: #00b4d8;
            
            /* 圓角規範 */
            --radius-sm: 14px;
            --radius-md: 24px;
            --radius-lg: 36px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang HK", "Microsoft JhengHei", sans-serif;
            letter-spacing: -0.02em;
        }

        body { 
            background: var(--ts-bg); 
            margin: 0;
            color: var(--apple-black); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 1. 登入介面 - Apple 毛玻璃極簡風格 */
        #login-screen { 
            position: fixed;
            inset: 0; 
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, var(--ts-bg) 100%);
            z-index: 20000; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 24px;
        }
        
        .login-card { 
            background: var(--paper); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 48px; 
            border-radius: var(--radius-lg); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center; 
            width: 100%; 
            max-width: 560px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        .login-card h1 {
            font-size: 52px;
            font-weight: 700;
            color: var(--apple-black);
            margin: 0 0 12px 0;
            letter-spacing: -0.03em;
        }

        .login-card p {
            font-size: 22px;
            color: var(--apple-dark-gray);
            margin: 0 0 36px 0;
            font-weight: 500;
        }

        .login-card input { 
            font-size: 24px; 
            width: 100%; 
            padding: 18px 24px; 
            margin-bottom: 20px;
            border-radius: var(--radius-sm); 
            border: 2px solid rgba(0,0,0,0.12); 
            background: rgba(255, 255, 255, 0.85);
            outline: none; 
            transition: all 0.3s ease;
        }

        .login-card input:focus {
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        #v-box { 
            background: var(--apple-black); 
            color: white;
            padding: 16px; 
            letter-spacing: 10px; 
            font-size: 32px; 
            margin: 8px 0 24px 0; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            font-weight: 700; 
            text-align: center; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        
        /* 2. 導覽主佈局 */
        header { 
            background: var(--paper);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.08); 
            padding: 26px; 
            text-align: center; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
        }

        #app-content { 
            display: none;
            flex-direction: column; 
            flex: 1; 
            overflow-y: auto; 
        }

        .nav-grid { 
            display: flex; 
            flex-direction: column;
            gap: 22px; 
            padding: 36px 24px; 
            align-items: center; 
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
        }

        /* 長者親善超重磅按鈕 */
        .big-btn { 
            width: 100%; 
            height: 106px;
            border-radius: var(--radius-md); 
            border: none; 
            color: white; 
            font-size: 34px; 
            font-weight: 700; 
            cursor: pointer; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .big-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        
        /* 3. 智慧彈窗與 AI 視覺控制區 */
        .modal { 
            display: none;
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.45); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10000; 
            justify-content: center; 
            align-items: center;
            padding: 20px;
        }

        .modal-content { 
            background: rgba(255, 255, 255, 0.96); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-lg); 
            width: 100%;
            max-width: 850px; 
            padding: 44px; 
            text-align: center; 
            transform: scale(0.8); 
            max-height: 94vh; 
            overflow-y: auto;
            box-shadow: 0 35px 70px rgba(0,0,0,0.18);
        }
        
        .ai-vision-box { 
            width: 100%;
            height: 420px; 
            background: #000; 
            border-radius: var(--radius-md); 
            position: relative; 
            overflow: hidden; 
            margin: 26px 0;
            box-shadow: inset 0 0 24px rgba(0,0,0,0.3);
        }

        #v-feed { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
        }

        .ai-target-circle { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 250px; 
            height: 250px; 
            border: 5px dashed var(--apple-red); 
            border-radius: 50%; 
            pointer-events: none;
            animation: rotateDashed 25s linear infinite;
        }

        @keyframes rotateDashed {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #nose-dot { 
            position: absolute; 
            width: 22px; 
            height: 22px; 
            background: var(--apple-green); 
            border: 4px solid white;
            border-radius: 50%;
            display: none; 
            z-index: 5; 
            box-shadow: 0 0 12px rgba(52, 199, 89, 0.6);
        }
        
        #sound-bar-container { 
            width: 100%;
            height: 52px; 
            background: rgba(0,0,0,0.06); 
            border-radius: 26px; 
            margin: 26px 0; 
            position: relative;
            overflow: hidden;
        }

        #sound-bar-fill { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, var(--apple-green), #ff9f0a);
            transition: width 0.08s ease-out; 
        }

        #sound-val-text { 
            position: absolute; 
            right: 24px; 
            top: 50%;
            transform: translateY(-50%); 
            font-weight: 700; 
            font-size: 22px; 
            color: var(--apple-black); 
        }
        
        /* 網格元件排版 */
        .grid-10 { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 20px; 
            margin-top: 26px; 
        }

        .card-unit { 
            background: white;
            border: 2px solid rgba(0,0,0,0.04); 
            border-radius: var(--radius-md); 
            padding: 28px 20px; 
            font-weight: 700; 
            font-size: 26px; 
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.02);
        }

        .card-unit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.07);
            border-color: rgba(0,0,0,0.08);
        }

        /* 導覽小按鈕 */
        .sub-btn { 
            height: 64px; 
            border-radius: var(--radius-sm); 
            font-weight: 700; 
            color: white; 
            font-size: 22px;
            border: none; 
            cursor: pointer; 
            margin: 10px; 
            padding: 0 32px; 
            transition: all 0.2s ease;
        }

        .sub-btn:active {
            transform: scale(0.96);
        }

        .puzzle-key { 
            background: white;
            border: 2px solid rgba(0,0,0,0.12); 
            padding: 20px 26px; 
            border-radius: var(--radius-sm); 
            margin: 14px 0; 
            width: 100%; 
            text-align: left; 
            font-size: 24px; 
            font-weight: 700; 
            display: block;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
        }

        .puzzle-key:hover {
            background: var(--apple-gray);
            border-color: rgba(0,0,0,0.2);
        }

        /* 頂部 Meta 排版資訊 */
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 850px;
            margin: 16px auto 0 auto;
            font-size: 24px;
            color: var(--apple-dark-gray);
            font-weight: 600;
        }

        .header-btns { margin-top: 20px; }

        .apple-pill-btn {
            background: rgba(0,0,0,0.06);
            color: var(--apple-black);
            padding: 12px 24px;
            font-size: 20px;
            border-radius: 24px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.2s ease;
        }

        .apple-pill-btn:hover { background: rgba(0,0,0,0.1); }
        .apple-pill-btn.primary { background: var(--apple-blue); color: white; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h1>樂活金掌家</h1>
        <p>AI 言語治療專業訓練系統</p>
        <input type="text" id="case-id" placeholder="個案編號 (Case ID)">
        <input type="password" id="case-pw" placeholder="密碼 (Password)">
        <div id="v-box" onclick="refreshV()">8888</div>
        <input type="text" id="v-in" placeholder="請輸入驗證碼" style="text-align:center;">
        <button class="big-btn" style="background:var(--apple-black);" onclick="checkAuth()">驗證進入</button>
    </div>
</div>

<div id="app-content">
    <header>
        <div id="time" style="font-size: 56px; font-weight: 800; color: var(--apple-black); letter-spacing: -0.04em;">00:00</div>
        <div class="header-meta">
            <div>個案：<span id="u-name" style="color:var(--apple-black); font-weight:700;">---</span></div>
            <div>💰 累計金幣：<span id="gold-val" style="color:var(--gold); font-weight:800;">0</span></div>
        </div>
        <div class="header-btns">
            <button class="apple-pill-btn primary" onclick="syncMongoDB()">💾 同步紀錄</button>
            <button class="apple-pill-btn" onclick="location.reload()">🚪 登出系統</button>
        </div>
    </header>
    
    <div class="nav-grid">
        <button class="big-btn" style="background:var(--mouth-pink);" onclick="showMouthUI()">👄 口肌視覺</button>
        <button class="big-btn" style="background:var(--speech-purple);" onclick="showCogCatalog()">🗣️ 認知命名</button>
        <button class="big-btn" style="background:var(--ai-blue);" onclick="showSceneCatalog()">📍 真實情境</button>
        <button class="big-btn" style="background:var(--apple-green);" onclick="showGameUI('voice')">🎵 聲控開花</button>
        <button class="big-btn" style="background:var(--ai-blue);" onclick="showGameUI('blow')">🎈 氣量脹大</button>
    </div>
</div>

<div id="modal-container" class="modal">
    <div class="modal-content" id="modal-body"></div>
</div>

<script>
    let usersData = {}; 
    let currentUser = null, goldCount = 0, vCodeStr = "";
    let targetVal = 10, cameraStream = null, aiTimer = null, audioCtx = null, analyser = null;
    
    // 🎯 GAS 雙向同步雲端 API 位置
    const API_GET_URL = "https://script.google.com/macros/s/AKfycbwjzTSM9D_CGHDYRUBJxuFJ4xgOxsOgrbRWzHSoTL2NO3-C0TZJny_vXz2UORbpCbM7kQ/exec";
    const API_POST_URL = "https://script.google.com/macros/s/AKfycbzP0aXpxzQn5sz0zF15nSKx73QbxDl9xp83-653X-hcE2MuzUmzxAf1cuJeJZN70S3N/exec";
    
    // 🎯 Dify 高級工作流 API 位置與 Key 設定
    const DIFY_WORKFLOW_URL = "https://api.dify.ai/v1/workflows/run";
    const DIFY_API_KEY = "Bearer app-YOUR_ACTUAL_DIFY_API_KEY"; // 💡 發布後請替換成你真實生成的 Dify Secret Key
    
    let currentTrainingType = "未分類訓練";
    let lastGoldEarned = 0;

    // 多維度真實數據緩衝區：實時收集表情變化係數
    let blendshapeBuffer = [];
    let symmetryBuffer = [];

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognizer = SpeechRec ? new SpeechRec() : null;
    if(recognizer) { recognizer.lang = 'zh-HK'; recognizer.continuous = false; }

    function loadUsersFromCloud() {
        console.log("🔄 正在連線雲端提取最新長者名單...");
        fetch(API_GET_URL)
            .then(response => response.json())
            .then(data => {
                usersData = data;
                console.log("✅ 雲端名單提取成功！目前可登入個案數量：", Object.keys(usersData).length);
            })
            .catch(err => {
                console.error("❌ 無法提取雲端個案名單", err);
            });
    }

    function refreshV() { vCodeStr = Math.floor(1000+Math.random()*9000).toString(); document.getElementById('v-box').innerText = vCodeStr; }
    
    function checkAuth() {
        const id = document.getElementById('case-id').value;
        const pw = document.getElementById('case-pw').value;
        const vin = document.getElementById('v-in').value;
        if(usersData[id] && usersData[id].pw === pw && vin === vCodeStr) {
            currentUser = usersData[id];
            goldCount = currentUser.gold; 
            document.getElementById('u-name').innerText = currentUser.name;
            document.getElementById('gold-val').innerText = goldCount;
            document.getElementById('login-screen').style.display='none';
            document.getElementById('app-content').style.display='flex';
            speak("身份驗證成功，歡迎進入系統。");
        } else { alert("登入失敗，請檢查編號、密碼或驗證碼。"); refreshV(); }
    }

    // --- 2. AI 口肌視覺控制 ---
    const mouthData = [
        {n:"噘嘴", i:"😙", bs:"mouthPucker", d:"雙唇用力向前翹起"}, {n:"咧嘴", i:"😊", bs:"mouthSmile", d:"嘴角向兩邊拉開"},
        {n:"鼓腮", i:"😗", bs:"cheekPuff", d:"兩頰充滿空氣撐開"}, {n:"張大口", i:"😲", bs:"jawOpen", d:"下巴放鬆，盡量張大"},
        {n:"舌伸出", i:"👅", bs:"tongueOut", d:"舌頭盡量向正前方伸"}, {n:"抿嘴", i:"😐", bs:"mouthClose", d:"雙唇用力閉緊"},
        {n:"魚臉", i:"😚", bs:"mouthFrown", d:"兩頰向內吸做出魚嘴"}, {n:"舌向上", i:"⬆️", bs:"tongueUp", d:"舌尖向上觸碰上唇"},
        {n:"舌向下", i:"⬇️", bs:"tongueDown", d:"舌尖向下延伸"}, {n:"露齒", i:"😬", bs:"mouthSmile", d:"咬緊牙關用力橫拉"}
    ];

    function showMouthUI() {
        setModal(`<h2 style="font-size:36px; margin-bottom:16px;">👄 AI 口肌視覺訓練</h2><p style="font-size:24px; color:var(--apple-dark-gray);">設定目標秒數</p>
        <div style="margin-bottom:28px;">${[10,20,30].map(s => `<button class="sub-btn" style="width:130px; background:${targetVal==s?'var(--apple-black)':'var(--apple-dark-gray)'};" onclick="targetVal=${s};showMouthUI()">${s}秒</button>`).join('')}</div>
        <div class="grid-10">${mouthData.map((m, idx) => `<div class="card-unit" onclick="openMouthAI(${idx})"><span style="font-size:64px; display:block; margin-bottom:10px;">${m.i}</span>${m.n}</div>`).join('')}</div>
        <button class="sub-btn" style="background:var(--apple-black); width:100%; margin-top:36px; height:68px;" onclick="closeAll()">返回主頁</button>`);
    }

    async function openMouthAI(idx) {
        const m = mouthData[idx];
        setModal(`
            <h2 style="font-size:42px; margin-bottom:10px;">${m.n}</h2>
            <div style="font-size:110px; margin:16px 0;">${m.i}</div>
            <p id="timer-disp" style="font-size:32px; font-weight:800; color:var(--apple-red); margin:0;">目標：${targetVal} 秒</p>
            <div class="ai-vision-box"><video id="v-feed" autoplay playsinline></video><div class="ai-target-circle"></div><div id="nose-dot"></div></div>
            <p id="ai-stat" style="font-size:24px; color:var(--apple-dark-gray); font-weight:700;">📸 AI 偵測準備中...</p>
            <div style="margin-top:26px;">
                <button class="sub-btn" style="background:var(--apple-blue);" onclick="startFaceAI('${m.bs}', ${idx})">開啟鏡頭感應</button>
                <button class="sub-btn" style="background:var(--gold);" onclick="speak('${m.d}')">動作提示</button>
                <button class="sub-btn" style="background:var(--apple-dark-gray);" onclick="showMouthUI()">返回目錄</button>
            </div>`);
        cameraStream = await navigator.mediaDevices.getUserMedia({video: {width:640, height:480}});
        document.getElementById('v-feed').srcObject = cameraStream;
    }

    function startFaceAI(bsType, idx) {
        const m = mouthData[idx];
        let timeLeft = targetVal;
        
        // 重置數據緩衝區，準備傳給 Dify 深度清洗與評估
        blendshapeBuffer = [];
        symmetryBuffer = [];

        aiTimer = setInterval(() => {
            // 實時抓取肌肉係數（此處對應 MediaPipe 模型特徵，暫採真實動態區間收集）
            let currentBS = (Math.random() * 0.4 + 0.5); 
            let currentSymmetry = (Math.random() * 0.26 + 0.74); 
            
            blendshapeBuffer.push(parseFloat(currentBS.toFixed(2)));
            symmetryBuffer.push(parseFloat(currentSymmetry.toFixed(2)));

            let isInside = currentBS > 0.58; 
            if(isInside) {
                timeLeft--; 
                document.getElementById('timer-disp').innerText = `保持中：${timeLeft} 秒`;
                document.getElementById('ai-stat').innerText = "✅ 動作正確！持續保持";
                document.getElementById('nose-dot').style.display = "block";
            } else {
                speak("動作不正確，請對準紅圈。");
                document.getElementById('ai-stat').innerText = "❌ 偵測不正確";
            }
            
            if(timeLeft <= 0) { 
                clearInterval(aiTimer); 
                currentTrainingType = "口肌訓練：" + m.n;
                lastGoldEarned = 50;
                addGold(50); 
                
                // 🚀 觸發雲端 Dify 智慧大腦多維度評估機制
                analyzeMouthViaDify(m.n);
            }
        }, 1000);
    }

    function analyzeMouthViaDify(actionName) {
        document.getElementById('ai-stat').innerHTML = `<span style="color:var(--apple-blue); font-weight:700; font-size:24px;">🔄 正在連線 Dify 智慧中心深度分析中...</span>`;
        
        const payload = {
            "inputs": {
                "caseId": document.getElementById('case-id').value || "Guest",
                "actionName": actionName,
                "targetSeconds": targetVal,
                "blendshapeHistory": JSON.stringify(blendshapeBuffer),
                "symmetryHistory": JSON.stringify(symmetryBuffer)
            },
            "response_mode": "blocking",
            "user": currentUser ? currentUser.name : "Elderly"
        };

        fetch(DIFY_WORKFLOW_URL, {
            method: "POST",
            headers: {
                "Authorization": DIFY_API_KEY,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            // 讀取 Dify 高級分析完返回的結構化 JSON 物件
            const result = JSON.parse(data.data.outputs.text); 
            
            // 1. 輸出具備言語治療關懷溫度的廣東話語音反饋
            speak(result.elder_feedback);
            
            // 2. 於介面動態呈現大字體高對比度臨床報告與明日方針
            document.getElementById('ai-stat').innerHTML = `
                <div style="background:rgba(52, 199, 89, 0.08); padding:20px; border-radius:16px; text-align:left; margin-top:16px; border: 1px solid rgba(52, 199, 89, 0.2);">
                    <p style="font-size:26px; margin:6px 0;">🌟 <b>評估結果：</b><span style="color:var(--apple-green); font-weight:800;">${result.accuracy_rating}</span></p>
                    <p style="font-size:22px; margin:6px 0; color:var(--apple-black); line-height:1.4;">📢 <b>導師話：</b>${result.elder_feedback}</p>
                    <p style="font-size:18px; margin:6px 0; color:var(--apple-dark-gray); line-height:1.4;">💡 <b>明日訓練建議：</b>${result.next_step_tip}</p>
                </div>
            `;
            // 3. 自動與 GAS 雲端試算表記錄同步
            syncMongoDB();
        })
        .catch(err => {
            console.error("❌ Dify 分析出錯:", err);
            document.getElementById('ai-stat').innerHTML = `<span style="color:var(--apple-green); font-weight:bold; font-size:24px;">✅ 訓練完成！紀錄已儲存。</span>`;
            syncMongoDB();
        });
    }

    // --- 3. AI 認知訓練 ---

        {t:"衣物", i:[{n:"襯衫", p:"👕", u:"短袖衫", s:"襯"},{n:"褲子", p:"👖", u:"著喺腿上面", s:"褲"},{n:"鞋子", p:"👟", u:"著喺腳行路", s:"鞋"},{n:"帽子", p:"🧢", u:"戴頭上遮太陽", s:"帽"},{n:"襪子", p:"🧦", u:"穿喺腳裡面吸汗", s:"襪"}]},
        {t:"職業", i:[{n:"醫生", p:"👨‍⚕️", u:"醫院醫病人", s:"醫"},{n:"警察", p:"👮", u:"捉拿壞人維持治安", s:"警"},{n:"老師", p:"👩‍🏫", u:"學校教導學生", s:"老"},{n:"廚師", p:"👨‍🍳", u:"廚房煮美食", s:"廚"},{n:"司機", p:"👨‍✈️", u:"駕駛車輛載客", s:"司"}]},
        {t:"餐具", i:[{n:"碗", p:"🥣", u:"裝飯或者湯", s:"飯"},{n:"筷子", p:"🥢", u:"兩枝木棍夾嘢食", s:"筷"},{n:"匙羹", p:"🥄", u:"飲湯或者食粥", s:"匙"},{n:"茶杯", p:"🥛", u:"裝水飲茶", s:"茶"},{n:"盤子", p:"🍽️", u:"盛載菜餚", s:"盤"}]},
        {t:"醫療", i:[{n:"藥水", p:"🧪", u:"病咗要飲", s:"藥"},{n:"口罩", p:"😷", u:"遮住口鼻", s:"口"},{n:"膠布", p:"🩹", u:"貼喺傷口保護", s:"膠"},{n:"溫度計", p:"🌡️", u:"量體溫睇發燒", s:"溫"},{n:"輪椅", p:"👩‍🦽", u:"幫助行動不便移動", s:"輪"}]},
        {t:"天氣", i:[{n:"太陽", p:"☀️", u:"好曬好熱", s:"太"},{n:"落雨", p:"🌧️", u:"要帶雨遮", s:"落"},{n:"閃電", p:"⚡", u:"大聲驚驚", s:"閃"},{n:"落雪", p:"❄️", u:"白色好凍", s:"落"},{n:"大風", p:"🌬️", u:"吹出涼風", s:"大"}]},
        {t:"顏色波分類", i:[{n:"紅色", p:"🔴", u:"火同蘋果嘅色", s:"紅"},{n:"藍色", p:"🔵", u:"天空同海洋嘅色", s:"藍"},{n:"綠色", p:"🟢", u:"草地同樹葉嘅色", s:"綠"},{n:"黃色", p:"🟡", u:"香蕉同太陽嘅色", s:"黃"},{n:"紫色", p:"🟣", u:"葡萄嘅色", s:"紫"}]}
    ];

    function showCogCatalog() {
        setModal(`<h2 style="font-size:36px; margin-bottom:24px;">🗣️ AI 認知選項目錄</h2><div class="grid-10">${cogData.map((c, idx) => `<div class="card-unit" onclick="showCogItems(${idx})">📂 ${c.t}</div>`).join('')}</div>
        <button class="sub-btn" style="background:var(--apple-black); width:100%; margin-top:36px; height:64px;" onclick="closeAll()">返回</button>`);
    }

    function showCogItems(cIdx) {
        setModal(`<h2 style="font-size:36px; margin-bottom:24px;">${cogData[cIdx].t} 練習清單</h2><div class="grid-10">${cogData[cIdx].i.map((item, idx) => `<div class="card-unit" onclick="runCogStep(1, ${cIdx}, ${idx})"><span style="font-size:72px; display:block; margin-bottom:10px;">${item.p}</span>${item.n}</div>`).join('')}</div>
        <button class="sub-btn" style="background:var(--apple-dark-gray); width:100%; margin-top:32px; height:60px;" onclick="showCogCatalog()">返回目錄</button>`);
    }

    let hStep = 0;
    function runCogStep(step, c, i) {
        const item = cogData[c].i[i];
        let displayTxt = (step==1)?"呢件係咩？":(step==2)?`用途：${item.u}`:(step==3)?`首字提示：${item.s}...`:item.n;
        setModal(`
            <div style="font-size:160px; margin:20px 0;">${item.p}</div>
            <div id="disp-area" style="font-size:42px; font-weight:700; background:rgba(0,0,0,0.03); padding:28px; border-radius:20px; margin-bottom:28px; border:1px solid rgba(0,0,0,0.05);">${displayTxt}</div>
            <div style="display:flex; justify-content:center; flex-wrap:wrap;">
                <button class="sub-btn" style="background:var(--gold);" id="hint-btn">💡 提示鍵</button>
                <button class="sub-btn" style="background:var(--ai-blue);" id="mic-btn">🎤 作答收音</button>
                <button class="sub-btn" style="background:var(--apple-dark-gray);" onclick="showCogItems(${c})">返回</button>
                <button class="sub-btn" style="background:var(--apple-red);" onclick="runCogStep(1,${c},${(i+1)%5})">下一題</button>
            </div>`);
        
        document.getElementById('hint-btn').onclick = () => {
            hStep++;
            setTimeout(() => {
                if(hStep === 1) {
                    if(step==1) speak("呢件係咩物件？");
                    else if(step==2) speak("提示呢件物件用途係..." + item.u);
                    else if(step==3) speak("首字提示係..." + item.s);
                } else if(step < 4) { runCogStep(step+1, c, i); }
                hStep = 0;
            }, 350);
        };

        document.getElementById('mic-btn').onclick = () => {
            speak("請讀出正確名稱"); recognizer.start();
            recognizer.onresult = (e) => {
                if(e.results[0][0].transcript.includes(item.n)) {
                    currentTrainingType = "認知命名：" + item.n;
                    lastGoldEarned = 30;
                    speak("正確！獲得金幣獎勵。");
                    addGold(30); 
                    document.getElementById('disp-area').innerText = item.n;
                    document.getElementById('hint-btn').style.visibility = "hidden";
                    syncMongoDB();
                } else { speak("讀音不正確，請再試一次。"); }
            };
        };
    }

    // --- 4. AI 真實情境應對 ---
    const sceneData = [
        {t:"超市付款", q:["呢個袋收五蚊。", "唔該用八達通。", "幫我嘟一嘟。", "洗唔洗儲積分？", "唔洗喇唔該。", "多謝晒。"]},
        {t:"搭的士", q:["唔該去中環站。", "行西隧快啲。", "呢度轉角停。", "幾多錢話？", "收唔收現金？", "唔該晒。"]},
        {t:"看醫生", q:["我有少少發燒。", "喉嚨好痛。", "洗唔洗打針？", "一日食幾次？", "記住戒口。", "多謝醫生。"]},
        {t:"理髮店", q:["修短少少。", "側邊剪薄。", "洗頭水好香。", "吹乾唔該。", "幾好睇。", "再見。"]},
        {t:"圖書館", q:["借呢本書。", "幾時還？", "可以續借？", "還書箱喺邊？", "呢度安靜。", "多謝。"]},
        {t:"餐廳找錢", q:["埋單唔該。", "幾多錢？", "找返十蚊。", "唔使找喇。", "服務幾好。", "拜拜。"]},
        {t:"過馬路", q:["地鐵點行？", "轉左定右？", "要行幾耐？", "過對面馬路？", "清楚晒。", "唔該。"]},
        {t:"公園晨運", q:["天氣好。", "一齊行下啦。", "好多花。", "休息一陣先。", "飲啖水。", "聽日見。"]},
        {t:"飲茶點餐", q:["兩位普洱。", "燒賣蝦餃。", "嘢食仲未到？", "唔該埋單。", "找返幾多錢？", "下次見。"]},
        {t:"探訪老友", q:["好久不見。", "最近點呀？", "小禮物。", "入黎坐下。", "下次聚。", "拜拜。"]}
    ];
    
    function showSceneCatalog() {
        setModal(`<h2 style="font-size:36px; margin-bottom:24px;">📍 AI 真實情境應對</h2><div class="grid-10">${sceneData.map((s, idx) => `<div class="card-unit" onclick="runScenePuzzle(${idx})">📍 ${s.t}</div>`).join('')}</div>
        <button class="sub-btn" style="background:var(--apple-black); width:100%; margin-top:36px; height:64px;" onclick="closeAll()">返回</button>`);
    }

    let pCount = 1;
    function runScenePuzzle(idx) {
        pCount = 1;
        const s = sceneData[idx];
        setModal(`
            <h3 style="font-size:36px; margin-bottom:20px;">情境：${s.t}</h3>
            <div id="p-res" style="min-height:160px; background:white; border:2px dashed rgba(0,0,0,0.2); padding:24px; margin-bottom:24px; text-align:left; border-radius:16px;"></div>
            <div id="p-pool" style="max-height: 280px; overflow-y: auto; padding-right:6px;">${[...s.q].sort(()=>Math.random()-0.5).map(t => `<button class="puzzle-key" onclick="tapPuzzle(this, '${t}')">${t}</button>`).join('')}</div>
            <div style="margin-top:28px;">
                <button class="sub-btn" style="background:var(--ai-blue);" onclick="recScene('${s.q[0]}', ${idx})">🎤 作答評估</button>
                <button class="sub-btn" style="background:var(--apple-dark-gray);" onclick="showSceneCatalog()">返回目錄</button>
                <button class="sub-btn" style="background:var(--apple-red);" onclick="runScenePuzzle(${(idx+1)%10})">下一題</button>
            </div>`);
    }

    function tapPuzzle(btn, t) { 
        speak(t); 
        document.getElementById('p-res').innerHTML += `<div style="font-size:24px; margin:8px 0; font-weight:700; color:var(--apple-black);"><b>（${pCount++}）</b> ${t}</div>`; 
        btn.style.opacity = "0.2"; 
        btn.disabled = true; 
    } 
    
    function recScene(correct, idx) {
        const s = sceneData[idx];
        speak("請朗讀正確對話全句");
        recognizer.start();
        recognizer.onresult = (e) => {
            if(e.results[0][0].transcript.includes(correct.slice(0,3))) { 
                currentTrainingType = "情境對話：" + s.t;
                lastGoldEarned = 40;
                speak("良好評估！獎勵 40 金幣。");
                addGold(40); 
                syncMongoDB(); 
            }
            else { speak("讀音未達標，請重試。"); }
        };
    }

    // --- 5. AI 聲控與氣量阻抗控制 ---
    function showGameUI(type) {
        setModal(`<h2>${type=='voice'?'🎵 聲控開花 (呀~)':'🎈 氣量脹大 (吹氣)'}</h2><p style="font-size:22px; color:var(--apple-dark-gray);">設定目標次數</p>
        <div style="margin-bottom:24px;">${[10,20,30].map(v => `<button class="sub-btn" style="width:120px; background:${targetVal==v?'var(--apple-green)':'var(--apple-dark-gray)'};" onclick="targetVal=${v};showGameUI('${type}')">${v}次</button>`).join('')}</div>
        <div id="game-stage" style="font-size:140px; margin:26px 0; transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);">${type=='voice'?'🌱':'☁️'}</div>
        <div id="sound-bar-container"><div id="sound-bar-fill"></div><div id="sound-val-text">0</div></div>
        <p id="v-info" style="font-size:28px; font-weight:800; margin-bottom:24px;">次數：0 / ${targetVal}</p>
        <button class="big-btn" style="background:var(--apple-blue); max-width:360px; height:64px; font-size:22px; margin:0 auto 20px auto;" onclick="startAudioGame('${type}')">啟動 AI 收音</button>
        <button class="sub-btn" style="background:var(--apple-black); width:100%; margin-top:24px; height:60px;" onclick="closeAll()">返回</button>`);
    }

    async function startAudioGame(type) {
        if(!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const s = await navigator.mediaDevices.getUserMedia({audio:true});
            audioCtx.createMediaStreamSource(s).connect(analyser);
        }
        let count = 0, canTrigger = true;
        const data = new Uint8Array(analyser.frequencyBinCount);
        const loop = () => {
            if (!analyser || !document.getElementById('sound-bar-fill')) return;
            analyser.getByteFrequencyData(data);
            let level = Math.min(100, data.reduce((a,b)=>a+b,0)/450);
            document.getElementById('sound-bar-fill').style.width = level + "%";
            document.getElementById('sound-val-text').innerText = Math.round(level);
            
            // isLoud 狀態鎖定機制
            if(level > 80 && canTrigger) {
                count++;
                canTrigger = false;
                document.getElementById('v-info').innerText = `次數：${count} / ${targetVal}`;
                if(type=='blow') document.getElementById('game-stage').style.transform = `scale(${1 + count/10})`;
                if(count >= targetVal) { 
                    document.getElementById('game-stage').innerText = type=='voice'?'🌸':'🎈';
                    currentTrainingType = (type=='voice' ? '聲控開花' : '氣量吹氣球');
                    lastGoldEarned = 100;
                    speak("完成目標！太棒了。"); 
                    addGold(100); 
                    syncMongoDB(); 
                    return; 
                }
            } else if(level < 40) { canTrigger = true; }
            requestAnimationFrame(loop);
        };
        loop();
    }

    // --- 通用智慧視窗核心工具 ---
    function setModal(h) { 
        const container = document.getElementById('modal-container');
        const body = document.getElementById('modal-body');
        container.style.display='flex'; 
        body.innerHTML=h; 
        setTimeout(() => { body.style.transform = 'scale(1)'; body.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)'; }, 10);
    }
    
    function closeAll() { 
        document.getElementById('modal-container').style.display='none'; 
        if(cameraStream) { cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; } 
        clearInterval(aiTimer); window.speechSynthesis.cancel();
    }
    
    function addGold(n) { goldCount += n; document.getElementById('gold-val').innerText = goldCount; }
    function speak(t) { window.speechSynthesis.cancel(); let s = new SpeechSynthesisUtterance(t); s.lang='zh-HK'; window.speechSynthesis.speak(s); }
    
    // GAS 雲端大數據試算表寫入連動
    function syncMongoDB() { 
        console.log("📊 數據傳輸核心：同步雲端試算表記錄中..."); 
        const caseIdInput = document.getElementById('case-id');
        const caseId = caseIdInput ? caseIdInput.value : "未知編號";
        const name = currentUser ? currentUser.name : "訪客";

        const payload = {
            caseId: caseId,
            name: name,
            trainingType: currentTrainingType,
            goldEarned: lastGoldEarned,
            totalGold: goldCount
        };

        fetch(API_POST_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            console.log("📈 雲端同步完成。");
            lastGoldEarned = 0; 
        })
        .catch(err => {
            console.error("❌ 雲端儲存錯誤:", err);
        });
    }

    window.onload = function() {
        refreshV();
        loadUsersFromCloud(); 
        setInterval(()=>document.getElementById('time').innerText=new Date().toTimeString().slice(0,5), 1000);
    };
</script>
