<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.5, user-scalable=yes, viewport-fit=cover">
    <title>LohasCare GeronTalk — 樂活智語 · 專科言語復康系統</title>

    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-gray: #f5f5f7;
            --apple-dark-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
            --ts-bg: #f2f5f3;
            --paper: rgba(255, 255, 255, 0.96);
            --gold: #8B6914;
            --speech-purple: #9b5de5;
            --mouth-pink: #ff99b6;
            --ai-blue: #00b4d8;
            --radius-sm: 14px;
            --radius-md: 24px;
            --radius-lg: 36px;
            --font-scale: 1;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang HK", "Microsoft JhengHei", sans-serif;
            letter-spacing: -0.02em;
        }
        html { font-size: calc(16px * var(--font-scale)); }
        body {
            background: var(--ts-bg);
            margin: 0;
            color: var(--apple-black);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body.high-contrast {
            --ts-bg: #000;
            --paper: #1a1a1a;
            --apple-black: #fff;
            --apple-dark-gray: #ccc;
            --apple-gray: #333;
        }

        .big-btn:focus-visible,
        .sub-btn:focus-visible,
        .card-unit:focus-visible,
        .apple-pill-btn:focus-visible,
        .puzzle-key:focus-visible,
        .onboard-option:focus-visible,
        input:focus-visible {
            outline: 4px solid var(--apple-blue) !important;
            outline-offset: 3px !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .ai-target-circle { animation: none !important; }
            .big-btn:active { transform: none !important; }
            .modal-content { transition: none !important; }
            #progress-ring-circle { transition: none !important; }
            .apple-pill-btn.sos { animation: none !important; }
            .spinner-ring { animation: none !important; }
        }

        #global-spinner {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(10px);
            z-index: 50000;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            color: #fff; text-align: center; padding: 20px;
        }
        .spinner-ring {
            width: 60px; height: 60px;
            border: 6px solid rgba(255,255,255,0.2);
            border-top-color: var(--apple-blue);
            border-radius: 50%;
            animation: spinRing 0.9s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }

        #login-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 40%, #ffffff 0%, var(--ts-bg) 100%);
            z-index: 20000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .login-card {
            background: var(--paper);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.6);
            text-align: center;
            width: 100%; max-width: 520px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.06);
        }
        .login-card h1 { font-size: 2.2rem; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.03em; }
        .login-card .tagline { font-size: 1.1rem; color: var(--apple-dark-gray); margin: 0 0 8px; font-weight: 600; }
        .login-card .version-badge {
            display: inline-block; background: var(--apple-blue); color: #fff;
            font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 24px;
        }
        .login-card input {
            font-size: 1.25rem; width: 100%; padding: 16px 18px; margin-bottom: 16px;
            border-radius: var(--radius-sm); border: 2px solid rgba(0,0,0,0.12);
            background: rgba(255,255,255,0.95); outline: none; transition: all 0.25s;
        }
        .login-card input:focus {
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0,113,227,0.15);
        }
        .login-hint { font-size: 0.95rem; color: var(--apple-dark-gray); margin-top: 16px; line-height: 1.4; }

        header {
            background: var(--paper);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.07);
            padding: 16px 18px 12px;
            text-align: center;
            flex-shrink: 0;
        }
        #app-content { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        #time { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
        .header-meta {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 640px; margin: 8px auto 0; font-size: 1.05rem;
            color: var(--apple-dark-gray); font-weight: 600;
        }
        .header-btns { margin-top: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .apple-pill-btn {
            background: rgba(0,0,0,0.06); color: var(--apple-black);
            padding: 8px 14px; font-size: 0.95rem; border-radius: 22px;
            border: none; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .apple-pill-btn:hover { background: rgba(0,0,0,0.1); }
        .apple-pill-btn.primary { background: var(--apple-blue); color: #fff; }
        .apple-pill-btn.danger { background: rgba(255,59,48,0.12); color: var(--apple-red); }
        .apple-pill-btn.sos { background: #ff3b30; color: #fff; font-weight: 900; animation: pulseSOS 2s infinite; }
        @keyframes pulseSOS {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .nav-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .nav-grid {
            display: flex; flex-direction: column; gap: 14px;
            padding: 20px 16px 40px; align-items: center;
            max-width: 560px; width: 100%; margin: 0 auto;
        }
        .big-btn {
            width: 100%; min-height: 88px; border-radius: var(--radius-md);
            border: none; color: #fff; font-size: 1.55rem; font-weight: 700;
            cursor: pointer; box-shadow: 0 5px 16px rgba(0,0,0,0.07);
            transition: transform 0.2s cubic-bezier(0.25,1,0.5,1), opacity 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 12px 16px; line-height: 1.25;
        }
        .big-btn:active { transform: scale(0.97); opacity: 0.92; }
        .big-btn .btn-sub { font-size: 0.85rem; font-weight: 500; opacity: 0.9; display: block; margin-top: 2px; }

        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.48); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); z-index: 10000;
            justify-content: center; align-items: center; padding: 12px;
        }
        .modal-content {
            background: rgba(255,255,255,0.98); border: 1px solid rgba(255,255,255,0.6);
            border-radius: var(--radius-lg); width: 100%; max-width: 860px;
            padding: 28px 22px; text-align: center;
            transform: scale(0.88); max-height: 94dvh; overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.16);
            -webkit-overflow-scrolling: touch;
        }

        .ai-vision-box {
            width: 100%; height: 320px; background: #000;
            border-radius: var(--radius-md); position: relative;
            overflow: hidden; margin: 16px 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        #v-feed, #v-feed-canvas {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); position: absolute; top: 0; left: 0;
        }
        #v-feed-canvas { z-index: 2; pointer-events: none; }
        
        .ai-ring-wrap {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 210px; height: 210px;
            pointer-events: none; z-index: 3;
        }
        .ai-target-circle {
            position: absolute; inset: 5px;
            border: 4px dashed rgba(255, 59, 48, 0.6); border-radius: 50%;
            pointer-events: none;
            animation: rotateDashed 20s linear infinite;
        }
        @keyframes rotateDashed {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #progress-ring-circle {
            transition: stroke-dashoffset 0.1s ease-out, stroke 0.2s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .blend-meter {
            display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap;
        }
        .blend-pill {
            background: rgba(0,0,0,0.05); border-radius: 16px; padding: 6px 14px;
            font-size: 0.95rem; font-weight: 700;
        }
        .blend-pill.good { background: rgba(52,199,89,0.15); color: var(--apple-green); }
        .blend-pill.bad { background: rgba(255,59,48,0.12); color: var(--apple-red); }

        .thresh-panel {
            background: rgba(0,0,0,0.03); border-radius: var(--radius-md);
            padding: 14px 16px; margin: 12px 0; border: 1px solid rgba(0,0,0,0.06);
        }
        .thresh-slider {
            -webkit-appearance: none; width: 100%; height: 10px;
            border-radius: 5px; background: #d1d1d6; outline: none; margin: 10px 0;
        }
        .thresh-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 28px; height: 28px;
            border-radius: 50%; background: var(--apple-blue); cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,113,227,0.4);
        }
        .sound-meter-wrapper { position: relative; width: 100%; margin: 20px 0 10px; }
        #sound-bar-container {
            width: 100%; height: 48px; background: rgba(0,0,0,0.06);
            border-radius: 24px; position: relative; overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
        }
        #sound-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, var(--apple-green) 0%, var(--apple-orange) 70%, var(--apple-red) 100%);
            transition: width 0.05s ease-out;
        }
        #sound-val-text {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            font-weight: 800; font-size: 1.15rem; color: var(--apple-black); z-index: 5;
        }
        #sound-status-pill {
            display: inline-block; padding: 8px 18px; border-radius: 20px;
            font-size: 1rem; font-weight: 700; margin: 8px 0;
            background: rgba(0,0,0,0.05); color: var(--apple-dark-gray); transition: all 0.2s;
        }
        .score-matrix-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            margin: 12px 0; padding: 12px; background: rgba(0,0,0,0.02);
            border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06);
        }
        .score-badge {
            background: #fff; border: 2px solid rgba(0,0,0,0.08);
            border-radius: 12px; padding: 6px 2px; text-align: center; transition: all 0.25s;
        }
        .score-badge .badge-label { font-size: 0.7rem; color: var(--apple-dark-gray); font-weight: 600; }
        .score-badge .badge-value { font-size: 1rem; font-weight: 800; color: rgba(0,0,0,0.22); margin-top: 1px; }
        .score-badge.achieved {
            border-color: var(--apple-green); background: rgba(52,199,89,0.08);
            transform: translateY(-2px); box-shadow: 0 3px 8px rgba(52,199,89,0.2);
        }
        .score-badge.achieved .badge-value { color: var(--apple-green); }

        .grid-10 {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; margin-top: 16px;
        }
        .card-unit {
            background: #fff; border: 2px solid rgba(0,0,0,0.05);
            border-radius: var(--radius-md); padding: 18px 10px;
            font-weight: 700; font-size: 1.15rem; cursor: pointer;
            transition: all 0.25s; box-shadow: 0 3px 10px rgba(0,0,0,0.02);
        }
        .card-unit:active { transform: scale(0.97); }
        .sub-btn {
            height: 56px; border-radius: var(--radius-sm); font-weight: 700;
            color: #fff; font-size: 1.05rem; border: none; cursor: pointer;
            margin: 6px; padding: 0 18px; transition: all 0.2s; min-width: 110px;
        }
        .sub-btn:active { transform: scale(0.96); }
        .puzzle-key {
            background: #fff; border: 2px solid rgba(0,0,0,0.1);
            padding: 14px 18px; border-radius: var(--radius-sm); margin: 8px 0;
            width: 100%; text-align: left; font-size: 1.1rem; font-weight: 700;
            display: block; cursor: pointer; transition: all 0.2s;
        }

        .progress-bars { margin: 16px 0; text-align: left; }
        .prog-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .prog-label { width: 70px; font-size: 0.85rem; font-weight: 600; color: var(--apple-dark-gray); flex-shrink: 0; }
        .prog-track { flex: 1; height: 18px; background: rgba(0,0,0,0.06); border-radius: 9px; overflow: hidden; }
        .prog-fill { height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--ai-blue), var(--apple-green)); transition: width 0.5s; min-width: 2px; }
        .prog-val { width: 40px; font-size: 0.85rem; font-weight: 700; text-align: right; }

        .onboard-option {
            display: block; width: 100%; text-align: left; padding: 16px 18px;
            margin: 8px 0; border: 2px solid rgba(0,0,0,0.1); border-radius: var(--radius-sm);
            background: #fff; font-size: 1.15rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .onboard-option.selected {
            border-color: var(--apple-blue); background: rgba(0,113,227,0.06);
            box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
        }

        #toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: var(--apple-black); color: #fff; padding: 14px 24px;
            border-radius: 24px; font-size: 1.05rem; font-weight: 600;
            z-index: 30000; opacity: 0; transition: all 0.35s cubic-bezier(0.25,1,0.5,1);
            max-width: 90%; text-align: center; pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .voice-mode-bar {
            background: linear-gradient(90deg, var(--speech-purple), var(--ai-blue));
            color: #fff; padding: 8px 16px; font-size: 0.95rem; font-weight: 700;
            text-align: center; display: none;
        }
        .voice-mode-bar.active { display: block; }

        .a11y-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .a11y-btn { background: rgba(0,0,0,0.05); border: none; border-radius: 16px; padding: 6px 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }

        .inline-input-box {
            display: none; margin: 12px 0; padding: 14px;
            background: rgba(0,113,227,0.06); border-radius: var(--radius-sm);
            border: 2px solid var(--apple-blue);
        }
        .inline-input-box.show { display: block; }
        .inline-input-box input {
            width: 100%; font-size: 1.2rem; padding: 12px 14px;
            border-radius: 10px; border: 2px solid rgba(0,0,0,0.12); margin-bottom: 8px;
        }

        .trainer-chat { max-height: 280px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.03); border-radius: 14px; padding: 12px; margin: 10px 0; }
        .chat-bubble { margin: 8px 0; padding: 10px 14px; border-radius: 14px; font-size: 1rem; line-height: 1.45; max-width: 92%; }
        .chat-bubble.bot { background: #fff; border: 1px solid rgba(0,0,0,0.08); }
        .chat-bubble.user { background: rgba(0,113,227,0.12); margin-left: auto; text-align: right; }
        .fatigue-banner { display: none; background: rgba(255,149,0,0.15); color: #b36b00; padding: 10px 14px; border-radius: 12px; font-weight: 700; margin: 8px 0; }
        .fatigue-banner.show { display: block; }
        .pause-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 10; align-items: center; justify-content: center; flex-direction: column; color: #fff; border-radius: var(--radius-md); }
        .pause-overlay.show { display: flex; }
        .home-core { display: flex; flex-direction: column; gap: 14px; width: 100%; }
        .home-free { display: none; flex-direction: column; gap: 14px; width: 100%; }
        .home-free.show { display: flex; }

        .daily-plan { background: linear-gradient(135deg, rgba(0,180,216,0.08), rgba(155,93,229,0.08)); border: 1px solid rgba(0,180,216,0.2); border-radius: var(--radius-md); padding: 16px; margin-bottom: 8px; text-align: left; }
        .daily-plan h3 { margin: 0 0 8px; font-size: 1.15rem; }
        .daily-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 1rem; font-weight: 600; cursor: pointer; }
        .daily-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--apple-dark-gray); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .daily-check.done { background: var(--apple-green); border-color: var(--apple-green); color: #fff; }

        .zoomable-container {
            width: 220px; height: 220px;
            margin: 10px auto;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0,0,0,0.04);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            position: relative;
            touch-action: pan-x pan-y pinch-zoom;
            cursor: zoom-in;
        }
        .zoomable-img {
            width: 100%; height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease-out;
            will-change: transform;
        }
        .zoom-hint {
            font-size: 0.8rem; color: var(--apple-dark-gray);
            margin-top: 4px; display: block;
        }
    </style>
</head>
<body>

<div id="global-spinner">
    <div class="spinner-ring"></div>
    <div id="spinner-msg" style="font-size:1.35rem;font-weight:700;">載入中，請稍候…</div>
</div>

<div id="toast"></div>

<!-- 登入介面 -->
<div id="login-screen">
    <div class="login-card">
        <h1>LohasCare GeronTalk</h1>
        <p class="tagline">樂活智語 · 專科適應性言語復康系統</p>
        <span class="version-badge">實證醫學聲學引擎版 (RCT Framework & Dual-Sync)</span>
        
        <input type="text" id="case-id" placeholder="個案編號 (例如: C-101)" value="C-101">
        <input type="password" id="case-pw" placeholder="密碼 (預設: 1234)" value="1234">
        
        <button class="big-btn" id="login-btn" style="background:var(--apple-black); min-height:72px; font-size:1.35rem; margin-top:8px;" onclick="checkAuth()">進入系統</button>
        <p class="login-hint">測試帳號：C-101 / 1234<br>或 admin / 8888</p>
        
        <div class="a11y-bar">
            <button class="a11y-btn" onclick="adjustFont(0.1)">字體 A+</button>
            <button class="a11y-btn" onclick="adjustFont(-0.1)">字體 A−</button>
            <button class="a11y-btn" onclick="toggleContrast()">高對比</button>
        </div>
    </div>
</div>

<!-- 主應用介面 -->
<div id="app-content">
    <div class="voice-mode-bar" id="voice-mode-bar">🎙️ 語音操作模式已開啟 — 可講「開口肌」「開聲控」「睇進度」「等等」「慢啲」</div>
    <header>
        <div id="time">00:00</div>
        <div class="header-meta">
            <div>個案：<span id="u-name" style="color:var(--apple-black);font-weight:700;">---</span></div>
            <div>💰 <span id="gold-val" style="color:var(--gold);font-weight:800;">0</span></div>
        </div>
        <div class="header-btns">
            <button class="apple-pill-btn sos" onclick="confirmSOS()">🆘 求助</button>
            <button class="apple-pill-btn primary" onclick="showProgressUI()">📊 我的進度</button>
            <button class="apple-pill-btn" onclick="manualSync()">💾 雲端同步</button>
            <button class="apple-pill-btn" id="voice-toggle-btn" onclick="toggleVoiceMode()">🎙️ 語音操作</button>
            <button class="apple-pill-btn danger" onclick="doLogout()">登出</button>
        </div>
        <div class="a11y-bar">
            <button class="a11y-btn" onclick="adjustFont(0.1)">A+</button>
            <button class="a11y-btn" onclick="adjustFont(-0.1)">A−</button>
            <button class="a11y-btn" onclick="toggleContrast()">高對比</button>
        </div>
    </header>

    <div class="nav-scroll">
        <div class="nav-grid">
            <div class="daily-plan" id="daily-plan-box">
                <h3>📋 今日建議訓練</h3>
                <div id="daily-plan-items"><p style="color:var(--apple-dark-gray);font-size:0.95rem;">載入中…</p></div>
            </div>

            <div class="home-core" id="home-core">
                <button class="big-btn" style="background:var(--apple-blue);" onclick="startDailyTraining()">
                    <span>▶️ 今日訓練<br><span class="btn-sub">RCT 實證個人化排程 · 一鍵開始</span></span>
                </button>
                <button class="big-btn" style="background:var(--speech-purple);" onclick="toggleFreePractice()">
                    <span>📂 自由練習<br><span class="btn-sub">口肌 · 聲調 · 聲控 · 認知訓練</span></span>
                </button>
                <button class="big-btn" style="background:var(--apple-green);" onclick="showProgressUI()">

function showLoading(msg) {
    var s = document.getElementById('global-spinner');
    var m = document.getElementById('spinner-msg');
    if (s && m) {
        m.innerText = msg || '載入中，請稍候…';
        s.style.display = 'flex';
    }
}

function hideLoading() {
    var s = document.getElementById('global-spinner');
    if (s) s.style.display = 'none';
}

function checkAuth() {
    try {
        var idEl = document.getElementById('case-id');
        var pwEl = document.getElementById('case-pw');
        var id = (idEl ? idEl.value.trim() : '') || 'C-101';
        var pw = (pwEl ? pwEl.value.trim() : '') || '1234';

        if (usersData[id] && usersData[id].pw === pw) {
            initUserSession(id, usersData[id]);
            return;
        }

        var fallbackData = { name: "個案 " + id, gold: 100, pw: pw };
        initUserSession(id, fallbackData);

        if (db) {
            db.collection("cases").doc(id).get().then(function(doc) {
                if (doc.exists && doc.data().name) {
                    currentUser.name = doc.data().name;
                    currentUser.gold = doc.data().gold || 100;
                    var nameEl = document.getElementById('u-name');
                    var goldEl = document.getElementById('gold-val');
                    if (nameEl) nameEl.innerText = currentUser.name;
                    if (goldEl) goldEl.innerText = currentUser.gold;
                }
            }).catch(function() {});
        }
    } catch (err) {
        var screen = document.getElementById('login-screen');
        var content = document.getElementById('app-content');
        if (screen) screen.style.display = 'none';
        if (content) content.style.display = 'flex';
    }
}

function initUserSession(id, data) {
    currentCaseId = id;
    currentUser = data;
    goldCount = data.gold || 0;
    if (data.adaptiveThreshMap) {
        adaptiveThreshMap = Object.assign(adaptiveThreshMap, data.adaptiveThreshMap);
    }
    var nameEl = document.getElementById('u-name');
    var goldEl = document.getElementById('gold-val');
    var screen = document.getElementById('login-screen');
    var content = document.getElementById('app-content');

    if (nameEl) nameEl.innerText = currentUser.name || id;
    if (goldEl) goldEl.innerText = goldCount;
    if (screen) screen.style.display = 'none';
    if (content) content.style.display = 'flex';

    if (!currentUser.profile) {
        setTimeout(function() { showOnboarding(); }, 300);
    } else {
        renderDailyPlan();
        speak('歡迎返嚟，' + currentUser.name + '。今日繼續加油！');
    }
}

function postToGoogleSheet(payload) {
    try {
        fetch(GOOGLE_SHEET_API, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(function() {});
    } catch (e) {}
}

function addHistory(type, gold, scores, note, metrics) {
    var scoresArr = scores || [];
    var avgVal = scoresArr.length ? Math.round(scoresArr.reduce(function(a, b) { return a + b; }, 0) / scoresArr.length) : '';
    var cName = currentUser ? currentUser.name : '陳伯伯';
    var cId = currentCaseId || 'C-101';

    var record = {
        date: new Date().toISOString(),
        caseId: cId,
        userName: cName,
        name: cName,
        trainingType: type,
        goldEarned: gold,
        totalGold: goldCount,
        scoresSummary: scoresArr.join(', '),
        avgIntensity: avgVal,
        recordedScores: scoresArr,
        targetThreshold: soundTargetThreshold,
        note: note || '',
        metrics: metrics || null
    };

    sessionHistory.push(record);
    saveLocal();
    postToGoogleSheet(record);

    if (db) {
        try {
            db.collection("training_logs").add(Object.assign({}, record, {
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })).catch(function() {});

            db.collection("cases").doc(cId).set({
                name: cName,
                gold: goldCount,
                adaptiveThreshMap: adaptiveThreshMap,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(function() {});
        } catch (_) {}
    }
}

function addGold(n) {
    goldCount += n;
    var gEl = document.getElementById('gold-val');
    if (gEl) gEl.innerText = goldCount;
    saveLocal();
    checkUnlocks();
}

function checkUnlocks() {
    var canUnlock = Math.floor(goldCount / 150);
    for (var i = 0; i < sceneData.length; i++) {
        if (i <= canUnlock + 2 && !unlockedScenes.includes(i)) {
            unlockedScenes.push(i);
            toast('🎉 解鎖新情境：「' + sceneData[i].t + '」');
            speak('恭喜解鎖新情境');
        }
    }
    saveLocal();
}

async function manualSync() {
    showLoading('正在比對雲端資料，請稍候…');
    var cName = currentUser ? currentUser.name : '陳伯伯';
    var cId = currentCaseId || 'C-101';

    postToGoogleSheet({
        date: new Date().toISOString(),
        caseId: cId,
        userName: cName,
        name: cName,
        trainingType: "手動雲端同步",
        goldEarned: 0,
        totalGold: goldCount,
        scoresSummary: "-",
        avgIntensity: "-"
    });

    if (db) {
        try {
            var docRef = db.collection("cases").doc(cId);
            var cloudDoc = await docRef.get();

            if (cloudDoc.exists) {
                var cloudData = cloudDoc.data();
                var cloudGold = cloudData.gold || 0;
                if (cloudGold > goldCount) {
                    goldCount = cloudGold;
                    document.getElementById('gold-val').innerText = goldCount;
                }
                if (cloudData.adaptiveThreshMap) {
                    adaptiveThreshMap = Object.assign(cloudData.adaptiveThreshMap, adaptiveThreshMap);
                }
            }

            await docRef.set({
                name: cName,
                gold: goldCount,
                profile: currentUser ? currentUser.profile : null,
                adaptiveThreshMap: adaptiveThreshMap,
                lastManualSync: firebase.firestore.FieldValue.serverTimestamp(),
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            saveLocal();
            hideLoading();
            toast('雲端資料已安全同步完成 ✓');
        } catch (err) {
            hideLoading();
            saveLocal();
            toast('已暫存於本機');
        }
    } else {
        hideLoading();
        saveLocal();
        toast('本機資料已儲存 ✓');
    }
}

function toast(msg, ms) {
    ms = ms || 2800;
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(function() { t.classList.remove('show'); }, ms);
}

function speak(text, rate) {
    rate = rate || 0.88;
    try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-HK';
        u.rate = rate;
        var voices = window.speechSynthesis.getVoices();
        var yue = voices.find(function(v) { return /zh-HK|yue|Cantonese/i.test(v.lang + v.name); });
        if (yue) u.voice = yue;
        window.speechSynthesis.speak(u);
    } catch (e) {}
}

function playGentleChime() {
    try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
    } catch (e) {}
}

function adjustFont(delta) {
    var cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) || 1;
    var next = Math.min(1.4, Math.max(0.85, cur + delta));
    document.documentElement.style.setProperty('--font-scale', next);
    localStorage.setItem('lohak_font', next);
    toast(delta > 0 ? '字體已放大' : '字體已縮小');
}

function toggleContrast() {
    document.body.classList.toggle('high-contrast');
    localStorage.setItem('lohak_contrast', document.body.classList.contains('high-contrast') ? '1' : '0');
    toast(document.body.classList.contains('high-contrast') ? '已開啟高對比' : '已關閉高對比');
}

function loadA11y() {
    var f = localStorage.getItem('lohak_font');
    if (f) document.documentElement.style.setProperty('--font-scale', f);
    if (localStorage.getItem('lohak_contrast') === '1') document.body.classList.add('high-contrast');
}

function loadLocal() {
    try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var d = JSON.parse(raw);
        if (d.users) usersData = Object.assign(usersData, d.users);
        if (d.history) sessionHistory = d.history;
        if (d.dailyDone) dailyDone = d.dailyDone;

function adaptiveThreshold(baseThreshold, history) {
    var recent = history.slice(-30);
    if (recent.length < 10) return baseThreshold;
    var passRate = recent.filter(function(s) { return s >= baseThreshold; }).length / recent.length;
    if (passRate > 0.85) return Math.min(0.90, baseThreshold + 0.05);
    if (passRate < 0.40) return Math.max(0.15, baseThreshold - 0.05);
    return baseThreshold;
}

function getAdaptiveThresh(bsType, baseThresh) {
    var key = (currentCaseId || 'Guest') + '_' + bsType;
    if (adaptiveThreshMap[key] == null) adaptiveThreshMap[key] = baseThresh;
    return adaptiveThreshMap[key];
}

function updateAdaptiveLive(bsType, baseThresh, buffer) {
    var adj = adaptiveThreshold(baseThresh, buffer);
    var key = (currentCaseId || 'Guest') + '_' + bsType;
    adaptiveThreshMap[key] = adj;
    return adj;
}

function detectFatigue(bsBuf, symBuf) {
    var recent = bsBuf.slice(-60);
    if (recent.length < 30) return { fatigue: false, level: 'low' };
    var mean = recent.reduce(function(a, b) { return a + b; }, 0) / recent.length;
    var variance = recent.reduce(function(s, v) { return s + Math.pow(v - mean, 2); }, 0) / recent.length;
    let symmetryDrop = 0;
    if (symBuf.length > 60) {
        var late = symBuf.slice(-30).reduce(function(a, b) { return a + b; }, 0) / 30;
        var early = symBuf.slice(-60, -30).reduce(function(a, b) { return a + b; }, 0) / 30;
        symmetryDrop = late - early;
    }
    var fatigue = variance > 0.05 || symmetryDrop < -0.15;
    var level = variance > 0.08 ? 'high' : (variance > 0.05 ? 'medium' : 'low');
    return { fatigue: fatigue, level: level, variance: variance, symmetryDrop: symmetryDrop };
}

async function initFaceLandmarker() {
    if (faceLandmarker) return faceLandmarker;
    showLoading('正在準備 AI 視覺模型，請稍候…');
    var isTensorOrLowEnd = /Pixel [678]|Mali|PowerVR/i.test(navigator.userAgent);
    var preferredDelegate = isTensorOrLowEnd ? 'CPU' : 'GPU';

    var loadPromise = (async function() {
        try {
            var vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0');
            var filesetResolver = await vision.FilesetResolver.forVisionTasks(
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm'
            );
            faceLandmarker = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                    delegate: preferredDelegate
                },
                runningMode: 'VIDEO',
                numFaces: 1,
                outputFaceBlendshapes: true
            });
            return faceLandmarker;
        } catch (e) {
            var vision2 = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0');
            var filesetResolver2 = await vision2.FilesetResolver.forVisionTasks(
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm'
            );
            faceLandmarker = await vision2.FaceLandmarker.createFromOptions(filesetResolver2, {
                baseOptions: {
                    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
                    delegate: 'CPU'
                },
                runningMode: 'VIDEO',
                numFaces: 1,
                outputFaceBlendshapes: true
            });
            return faceLandmarker;
        }
    })();

    var timeoutPromise = new Promise(function(resolve) {
        setTimeout(function() { resolve(null); }, 4500);
    });

    try {
        var res = await Promise.race([loadPromise, timeoutPromise]);
        hideLoading();
        return res;
    } catch (err) {
        hideLoading();
        return null;
    }
}

function calcGeometricCheekPuffEnhanced(landmarks, blendshapes) {
    if (!landmarks || landmarks.length < 468) return 0;
    var leftCheek = landmarks[234];
    var rightCheek = landmarks[454];
    var nose = landmarks[1];

    var cheekWidth = Math.abs(rightCheek.x - leftCheek.x);
    var noseToCheek = Math.abs(nose.x - leftCheek.x);
    if (noseToCheek <= 0.001) return 0;

    var ratio = cheekWidth / noseToCheek;
    var baseScore = Math.min(1.0, Math.max(0, (ratio - 1.80) * 3.5));

    var mouthClose = getBlendScore(blendshapes, 'mouthClose');
    var cheekSquintL = getBlendScore(blendshapes, 'cheekSquintLeft');
    var cheekSquintR = getBlendScore(blendshapes, 'cheekSquintRight');
    var coactivation = (mouthClose * 0.4 + (cheekSquintL + cheekSquintR) / 2 * 0.6);

    if (coactivation > 0.25) {
        baseScore = Math.min(1.0, baseScore + coactivation * 0.35);
    }
    return baseScore;
}

function calcGeometricTongueOut(landmarks) {
    if (!landmarks || landmarks.length < 468) return 0;
    var upperInnerLip = landmarks[13];
    var lowerInnerLip = landmarks[14];
    var chin = landmarks[152];
    var nose = landmarks[1];

    var lipGap = Math.abs(lowerInnerLip.y - upperInnerLip.y);
    var noseChinDist = Math.abs(chin.y - nose.y);
    if (noseChinDist <= 0.001) return 0;

    var ratio = lipGap / noseChinDist;
    return Math.min(1.0, Math.max(0, (ratio - 0.08) * 4.2));
}

function getUnifiedMouthScore(result, bsType) {
    var landmarks = (result && result.faceLandmarks && result.faceLandmarks.length) ? result.faceLandmarks[0] : null;
    var blendshapes = (result && result.faceBlendshapes && result.faceBlendshapes.length) ? result.faceBlendshapes : null;
    
    if (bsType === 'cheekPuff') {
        return calcGeometricCheekPuffEnhanced(landmarks, blendshapes);
    }
    if (bsType === 'tongueOut' || bsType === 'tongueUp' || bsType === 'tongueDown') {
        return calcGeometricTongueOut(landmarks);
    }
    if (blendshapes) {
        return getBlendScore(blendshapes, bsType);
    }
    return 0.5;
}

var BS_MAP = {
    mouthPucker: ['mouthPucker', 'mouthFunnel'],
    mouthSmile: ['mouthSmileLeft', 'mouthSmileRight'],
    jawOpen: ['jawOpen'],
    mouthClose: ['mouthClose', 'mouthPressLeft', 'mouthPressRight'],
    mouthFrown: ['mouthFrownLeft', 'mouthFrownRight']
};

function getBlendScore(blendshapes, bsType) {
    if (!blendshapes || !blendshapes.length) return 0;
    var cats = blendshapes[0].categories || [];
    var names = BS_MAP[bsType] || [bsType];
    var sum = 0, count = 0;
    for (var i = 0; i < names.length; i++) {
        var n = names[i];
        var found = cats.find(function(c) { return c.categoryName.toLowerCase() === n.toLowerCase(); });
        if (found) { sum += found.score; count++; }
    }
    return count === 0 ? 0 : sum / count;
}

function calcGeometricSymmetry(landmarks) {
    if (!landmarks || landmarks.length < 300) return 0.95;
    var leftCorner = landmarks[61];
    var rightCorner = landmarks[291];
    var nose = landmarks[1];

    var distL = Math.abs(nose.x - leftCorner.x);
    var distR = Math.abs(rightCorner.x - nose.x);
    var yDiff = Math.abs(leftCorner.y - rightCorner.y);

    var balance = Math.abs(distL - distR) / Math.max(0.01, (distL + distR));
    var symmetry = Math.max(0, 1.0 - (balance * 1.5 + yDiff * 2.0));
    return parseFloat(symmetry.toFixed(2));
}

function analyzeAcousticBiomarkers(timeData, sampleRate) {
    sampleRate = sampleRate || 44100;
    var N = timeData.length;
    var signal = new Float32Array(N);
    var mean = 0;

    for (var i = 0; i < N; i++) {
        signal[i] = (timeData[i] - 128) / 128.0;
        mean += signal[i];
    }
    mean /= N;
    for (var i = 0; i < N; i++) signal[i] -= mean;

    var minPeriod = Math.floor(sampleRate / 400);
    var maxPeriod = Math.floor(sampleRate / 70);

    var bestLag = -1;
    var maxCorr = 0;

    for (var lag = minPeriod; lag <= maxPeriod; lag++) {
        var corr = 0;
        var energy1 = 0, energy2 = 0;
        for (var n = 0; n < N - lag; n += 2) {
            corr += signal[n] * signal[n + lag];
            energy1 += signal[n] * signal[n];
            energy2 += signal[n + lag] * signal[n + lag];
        }
        var denom = Math.sqrt(energy1 * energy2);
        var normCorr = denom > 0 ? (corr / denom) : 0;
        if (normCorr > maxCorr) {
            maxCorr = normCorr;
            bestLag = lag;
        }
    }

    if (bestLag < minPeriod || maxCorr < 0.35) {
        return { jitter: 0.85, shimmer: 2.35, pdRisk: '音訊能量微弱' };
    }

    var cycleLength = bestLag;
    var periodDurations = [];
    var rmsAmplitudes = [];

    for (var start = 0; start + cycleLength < N; start += cycleLength) {
        periodDurations.push(cycleLength);
        var sumSq = 0;
        for (var k = 0; k < cycleLength; k++) {
            sumSq += signal[start + k] * signal[start + k];
        }
        rmsAmplitudes.push(Math.sqrt(sumSq / cycleLength));
    }

    if (periodDurations.length < 4) {
        return { jitter: 0.90, shimmer: 2.40, pdRisk: '信號樣本不足' };
    }

    var diffP = 0, sumP = 0;
    for (var p = 0; p < periodDurations.length - 1; p++) {
        diffP += Math.abs(periodDurations[p] - periodDurations[p + 1]);
        sumP += periodDurations[p];
    }
    sumP += periodDurations[periodDurations.length - 1];
    var meanP = sumP / periodDurations.length;
    var jitterVal = meanP > 0 ? (diffP / (periodDurations.length - 1)) / meanP : 0.01;

    var diffA = 0, sumA = 0;
    for (var a = 0; a < rmsAmplitudes.length - 1; a++) {
        diffA += Math.abs(rmsAmplitudes[a] - rmsAmplitudes[a + 1]);
        sumA += rmsAmplitudes[a];
    }
    sumA += rmsAmplitudes[rmsAmplitudes.length - 1];
    var meanA = sumA / rmsAmplitudes.length;
    var shimmerVal = meanA > 0 ? (diffA / (rmsAmplitudes.length - 1)) / meanA : 0.03;

    var jitterPct = parseFloat((jitterVal * 100).toFixed(2));
    var shimmerPct = parseFloat((shimmerVal * 100).toFixed(2));
    var pdRisk = (jitterPct > 1.04 || shimmerPct > 3.81) ? '聲學抖動偏高 (建議持續監測)' : '聲學指標穩定 (正常範圍)';

    return {
        jitter: jitterPct,
        shimmer: shimmerPct,
        pdRisk: pdRisk
    };
}

};

function updateVisualProgressRing(score, liveThresh) {
    var ring = document.getElementById('progress-ring-circle');
    if (!ring) return;
    var circumference = 2 * Math.PI * 95;
    var percent = Math.min(1.0, Math.max(0, score / Math.max(0.01, liveThresh)));
    var offset = circumference - (percent * circumference);
    ring.style.strokeDashoffset = offset;
    ring.style.stroke = score >= liveThresh ? "var(--apple-green)" : "var(--apple-red)";
}

window.startFaceAI = function(bsType, idx) {
    var m = mouthData[idx];
    var timeLeft = (facePauseSnapshot && facePauseSnapshot.idx === idx) ? facePauseSnapshot.timeLeft : targetVal;
    var holdAccum = 0;
    var smoothedScore = 0;

    if (!facePauseSnapshot || facePauseSnapshot.idx !== idx) {
        blendshapeBuffer = [];
        symmetryBuffer = [];
    }
    faceRunning = true;
    facePaused = false;
    facePauseSnapshot = null;

    var liveThresh = getAdaptiveThresh(m.bs, m.thresh);
    currentMouthThresh = liveThresh;

    var btn = document.getElementById('start-face-btn');
    var pauseBtn = document.getElementById('pause-face-btn');
    if (btn) { btn.disabled = true; btn.innerText = '偵測中…'; }
    if (pauseBtn) pauseBtn.disabled = false;

    var video = document.getElementById('v-feed');
    var canvas = document.getElementById('v-feed-canvas');
    var ctx = canvas ? canvas.getContext('2d') : null;
    var lastVideoTime = -1;
    var fatigueNotified = false;

    var loop = function() {
        if (!faceRunning) return;
        if (facePaused) { faceAnimId = requestAnimationFrame(loop); return; }

        if (video && video.readyState >= 2) {
            if (canvas && (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight)) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            if (faceLandmarker && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                var result = faceLandmarker.detectForVideo(video, performance.now());
                
                var rawScore = getUnifiedMouthScore(result, bsType);
                
                var sym = (result && result.faceLandmarks && result.faceLandmarks.length) 
                    ? calcGeometricSymmetry(result.faceLandmarks[0]) 
                    : 0.95;

                smoothedScore = smoothedScore === 0 ? rawScore : (smoothedScore * 0.7 + rawScore * 0.3);
                var score = smoothedScore;

                updateVisualProgressRing(score, liveThresh);

                blendshapeBuffer.push(parseFloat(score.toFixed(3)));
                symmetryBuffer.push(parseFloat(sym.toFixed(3)));
                if (blendshapeBuffer.length > 300) blendshapeBuffer.shift();
                if (symmetryBuffer.length > 300) symmetryBuffer.shift();

                liveThresh = updateAdaptiveLive(bsType, m.thresh, blendshapeBuffer);
                currentMouthThresh = liveThresh;
                var atd = document.getElementById('adapt-thresh-disp');
                if (atd) atd.textContent = Math.round(liveThresh * 100) + '%';

                var fat = detectFatigue(blendshapeBuffer, symmetryBuffer);
                var fb = document.getElementById('fatigue-banner');
                if (fat.fatigue && fb) {
                    fb.classList.add('show');
                    if (!fatigueNotified) {
                        fatigueNotified = true;
                        liveThresh = Math.max(0.15, liveThresh - 0.08);
                        currentMouthThresh = liveThresh;
                        speak('放鬆飲啖水先，我已經為你調低咗門檻');
                    }
                }

                var bsEl = document.getElementById('bs-score');
                var syEl = document.getElementById('sym-score');
                if (bsEl) {
                    bsEl.textContent = '強度：' + Math.round(score * 100) + '%';
                    bsEl.className = 'blend-pill ' + (score >= liveThresh ? 'good' : 'bad');
                }
                if (syEl) {
                    syEl.textContent = '對稱度：' + Math.round(sym * 100) + '%';
                    syEl.className = 'blend-pill ' + (sym >= 0.7 ? 'good' : 'bad');
                }

                if (ctx && result.faceLandmarks && result.faceLandmarks.length) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = score >= liveThresh ? 'rgba(52,199,89,0.7)' : 'rgba(255,59,48,0.5)';
                    for (var p = 0; p < result.faceLandmarks[0].length; p++) {
                        var pt = result.faceLandmarks[0][p];
                        ctx.beginPath();
                        ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (score >= liveThresh) {
                    holdAccum += 1 / 30;
                    if (holdAccum >= 1) {
                        holdAccum -= 1;
                        timeLeft--;
                        window._faceTimeLeft = timeLeft;
                        var tDisp = document.getElementById('timer-disp');
                        if (tDisp) tDisp.innerText = '保持中：' + timeLeft + ' 秒';
                        var stat = document.getElementById('ai-stat');
                        if (stat) stat.innerText = '✅ 動作標準，請繼續保持！';
                    }
                } else {
                    var stat = document.getElementById('ai-stat');
                    if (stat) stat.innerText = '❌ 請對準畫面並用力做出動作';
                }

                if (timeLeft <= 0) {
                    faceRunning = false;
                    stopFaceCam();
                    currentTrainingType = '口肌訓練：' + m.n;
                    var avgBS = blendshapeBuffer.length ? (blendshapeBuffer.reduce(function(a, b) { return a + b; }, 0) / blendshapeBuffer.length) : 0;
                    var avgSym = symmetryBuffer.length ? (symmetryBuffer.reduce(function(a, b) { return a + b; }, 0) / symmetryBuffer.length) : 0;
                    
                    addGold(50);
                    markDaily('mouth');
                    addHistory('口肌訓練：' + m.n, 50, [Math.round(avgBS * 100), Math.round(avgSym * 100)], m.bs, {
                        avgBS: avgBS, avgSym: avgSym, finalThresh: liveThresh
                    });
                    showMouthResult(m.n, avgBS, avgSym, liveThresh);
                    return;
                }
            }
        }
        faceAnimId = requestAnimationFrame(loop);
    };
    faceAnimId = requestAnimationFrame(loop);
    speak('開始偵測，請做出動作並維持住');
};

// 圖片縮放
function setupImageZoom(containerId, imgId) {
    var container = document.getElementById(containerId);
    var img = document.getElementById(imgId);
    if (!container || !img) return;

    var scale = 1;
    var initialDistance = 0;

    container.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
            initialDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2 && initialDistance > 0) {
            var currentDistance = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            var factor = currentDistance / initialDistance;
            scale = Math.min(2.8, Math.max(1, scale * factor));
            img.style.transform = 'scale(' + scale + ')';
            initialDistance = currentDistance;
        }
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) {
            initialDistance = 0;
        }
    });

    container.addEventListener('click', function() {
        scale = scale > 1.1 ? 1 : 1.6;
        img.style.transform = 'scale(' + scale + ')';
    });
}

async function startAudioGame(type) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        audioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.3;

        var source = audioCtx.createMediaStreamSource(audioStream);
        source.connect(analyser);

        var count = 0, canTrigger = true;
        var data = new Uint8Array(analyser.frequencyBinCount);
        var timeData = new Uint8Array(analyser.fftSize);
        toast('收音中，請大聲發出持續「呀～」或吹氣！');

        var loop = function() {
            if (!analyser || !document.getElementById('sound-bar-fill')) return;
            analyser.getByteFrequencyData(data);
            analyser.getByteTimeDomainData(timeData);

            var sum = 0;
            for (var i = 0; i < data.length; i++) sum += data[i];
            var avg = sum / data.length;
            var level = Math.min(100, Math.round((avg / 110) * 100));

            var fill = document.getElementById('sound-bar-fill');
            var valText = document.getElementById('sound-val-text');
            if (fill) fill.style.width = level + '%';
            if (valText) valText.innerText = level + '%';

            if (level >= soundTargetThreshold && canTrigger) {
                count++;
                canTrigger = false;
                recordedScores.push(level);

                var acoustic = analyzeAcousticBiomarkers(timeData, audioCtx.sampleRate);
                recordedBiomarkers.push(acoustic);

                var badge = document.getElementById('badge-' + count);
                var valEl = document.getElementById('val-' + count);
                if (badge) badge.classList.add('achieved');
                if (valEl) valEl.innerText = level + '%';
                var statusPill = document.getElementById('sound-status-pill');
                if (statusPill) {
                    statusPill.style.color = 'var(--apple-green)';
                    statusPill.innerText = '🎉 第 ' + count + ' 次達標！ (Jitter: ' + acoustic.jitter + '% / Shimmer: ' + acoustic.shimmer + '%)';
                }
                var vInfo = document.getElementById('v-info');
                if (vInfo) vInfo.innerText = '達標進度：' + count + ' / 10 次';
                
                var stage = document.getElementById('game-stage');
                if (stage) stage.style.transform = 'scale(' + (1 + count * 0.08) + ')';

                if (count >= 10) {
                    stopAudioGame();
                    if (stage) stage.innerText = type === 'voice' ? '🌸' : '🎈';
                    addGold(100);
                    markDaily(type === 'voice' ? 'voice' : 'blow');
                    
                    var itemTitle = (type === 'voice' ? '聲控發聲' : '氣量阻抗') + ' (' + soundTargetThreshold + '%)';
                    addHistory(itemTitle, 100, recordedScores.slice(), '', {
                        biomarkers: recordedBiomarkers.slice(),
                        avgJitter: recordedBiomarkers.length ? (recordedBiomarkers.reduce(function(s, b){ return s + b.jitter; }, 0) / recordedBiomarkers.length).toFixed(2) : 0,
                        avgShimmer: recordedBiomarkers.length ? (recordedBiomarkers.reduce(function(s, b){ return s + b.shimmer; }, 0) / recordedBiomarkers.length).toFixed(2) : 0
                    });
                    
                    speak('太厲害喇！連續達標十次，聲學穩定度良好！獲得一百金幣！');
                    toast('🏆 訓練完成！聲學生物標記已存入臨床雲端');
                    return;
                }
            } else if (level <= soundResetThreshold && !canTrigger) {
                canTrigger = true;
                var statusPill = document.getElementById('sound-status-pill');
                if (statusPill) {
                    statusPill.style.color = 'var(--apple-dark-gray)';
                    statusPill.innerText = '💨 換氣完成，請發出下一次聲音';
                }
            }
            audioLoopId = requestAnimationFrame(loop);
        };
        audioLoopId = requestAnimationFrame(loop);
    } catch (e) {
        toast('無法開啟麥克風，請檢查權限');
    }
}

async function primeMicrophoneForWebKit() {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            var tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            tempStream.getTracks().forEach(function(track) { track.stop(); });
        }
    } catch (e) {}
}

async function listenOnce(callback) {
    listenCallback = callback;
    var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRec) {
        showInlineSpeechInput();
        return;
    }

    await primeMicrophoneForWebKit();

    try {
        var r = new SpeechRec();
        r.lang = 'zh-HK';
        r.continuous = false;
        r.interimResults = false;

        r.onresult = function(e) {
            hideInlineSpeechInput();
            callback(e.results[0][0].transcript);
        };
        r.onerror = function() {
            toast('提示：未收到聲音，請靠近手機麥克風或使用鍵盤輸入');
            showInlineSpeechInput();
        };
        r.start();
        toast('🎙️ 請開始說話…');
    } catch (e) {
        showInlineSpeechInput();
    }
}

function showInlineSpeechInput() {
    var box = document.getElementById('inline-speech-box');
    if (!box) {
        var body = document.getElementById('modal-body');
        if (!body) return;
        box = document.createElement('div');
        box.id = 'inline-speech-box';
        box.className = 'inline-input-box show';
        box.innerHTML = '<p style="font-weight:700;margin:0 0 8px;text-align:left;">✍️ 鍵盤輸入替代作答：</p>' +
            '<input type="text" id="inline-speech-val" placeholder="請在此輸入答案">' +
            '<button class="sub-btn" style="background:var(--apple-blue);width:100%;height:48px;" onclick="submitInlineSpeech()">送出確認</button>';
        body.appendChild(box);
    } else {
        box.classList.add('show');
    }
}

function hideInlineSpeechInput() {
    var box = document.getElementById('inline-speech-box');
    if (box) box.classList.remove('show');
}

function submitInlineSpeech() {
    var val = document.getElementById('inline-speech-val').value.trim();
    hideInlineSpeechInput();
    if (listenCallback) listenCallback(val);
    listenCallback = null;
}

var backoffDelays = [300, 1000, 2000, 3500];
var backoffIndex = 0;

function toggleVoiceMode() {
    if (voiceModeActive) stopVoiceMode();
    else startVoiceMode();
}

function startVoiceMode() {
    var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { 
        toast('此瀏覽器不支援語音控制指令，請使用點擊操作'); 
        return; 
    }
    voiceModeActive = true;
    backoffIndex = 0;
    var bar = document.getElementById('voice-mode-bar');
    var btn = document.getElementById('voice-toggle-btn');
    if (bar) bar.classList.add('active');
    if (btn) btn.classList.add('primary');
    toast('語音指令已啟動');
    speak('語音操作已開啟，你可以講開口肌、開聲控，慢啲可以叫我等等');
    loopVoiceCommand();
}

function stopVoiceMode() {
    voiceModeActive = false;
    var bar = document.getElementById('voice-mode-bar');
    var btn = document.getElementById('voice-toggle-btn');
    if (bar) bar.classList.remove('active');
    if (btn) btn.classList.remove('primary');
}

async function loopVoiceCommand() {
    var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!voiceModeActive || !SpeechRec) return;

    await primeMicrophoneForWebKit();

    try {
        var r = new SpeechRec();
        r.lang = 'zh-HK';
        r.onresult = function(e) {
            backoffIndex = 0;
            var t = (e.results[0][0].transcript || '').replace(/\s/g, '');
            
            if (/唔係|等等|再講|停|慢啲/.test(t)) {
                playGentleChime();
                speak('好，你慢慢諗，我聽緊你講');
                setTimeout(loopVoiceCommand, 2800);
                return;
            }

            handleVoiceCmd(t);
            setTimeout(loopVoiceCommand, 800);
        };
        r.onerror = function() {
            var delay = backoffDelays[backoffIndex] || 3500;
            backoffIndex = Math.min(backoffIndex + 1, backoffDelays.length - 1);
            setTimeout(loopVoiceCommand, delay);
        };
        r.onend = function() {
            if (voiceModeActive) setTimeout(loopVoiceCommand, 600);
        };
        r.start();
    } catch (_) {
        var delay = backoffDelays[backoffIndex] || 3500;
        backoffIndex = Math.min(backoffIndex + 1, backoffDelays.length - 1);
        setTimeout(loopVoiceCommand, delay);
    }
}

function handleVoiceCmd(t) {
    if (/今日訓練|開始訓練/.test(t)) { closeAll(); startDailyTraining(); }
    else if (/口肌|嘴巴/.test(t)) { closeAll(); showMouthUI(); }
    else if (/聲調|粵語/.test(t)) { closeAll(); showCantoneseToneUI(); }
    else if (/聲控|開花/.test(t)) { closeAll(); showGameUI('voice'); }
    else if (/吹氣|氣量/.test(t)) { closeAll(); showGameUI('blow'); }
    else if (/進度|報告/.test(t)) { showProgressUI(); }
    else if (/返回|主頁/.test(t)) { closeAll(); }
    else if (/救命|求助|唔舒服/.test(t)) { confirmSOS(); }
}

function showProgressUI() {
    speak('正在開啟訓練進度報告');
    var last7 = sessionHistory.filter(function(h) {
        return (Date.now() - new Date(h.date).getTime()) < 7 * 86400000;
    });
    var byType = {};
    last7.forEach(function(h) {
        var key = h.type.split('：')[0];
        byType[key] = (byType[key] || 0) + 1;
    });
    var maxC = Math.max.apply(null, Object.values(byType).concat([1]));
    var bars = Object.keys(byType).length
        ? Object.entries(byType).map(function(e) {
            return '<div class="prog-row">' +
                '<div class="prog-label">' + e[0] + '</div>' +
                '<div class="prog-track"><div class="prog-fill" style="width:' + Math.round(e[1] / maxC * 100) + '%"></div></div>' +
                '<div class="prog-val">' + e[1] + '次</div>' +
            '</div>';
        }).join('')
        : '<p style="color:var(--apple-dark-gray);">近 7 日暫無訓練紀錄，快啲開始練習啦！</p>';

    setModal(
        '<h2 style="font-size:1.7rem;margin-bottom:6px;">📊 我的訓練進度</h2>' +
        '<p style="font-size:1.05rem;color:var(--apple-dark-gray);">近 7 日累計完成 <b>' + last7.length + '</b> 次訓練</p>' +
        '<div class="progress-bars">' + bars + '</div>' +
        '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
            '<button class="sub-btn" style="background:var(--apple-green);" onclick="shareToFamily()">📲 分享給家人</button>' +
            '<button class="sub-btn" style="background:var(--apple-blue);" onclick="printReport()">📋 檢視臨床報告</button>' +
            '<button class="sub-btn" style="background:var(--apple-black);" onclick="closeAll()">返回主頁</button>' +
        '</div>'
    );
}

        navigator.share({ title: '復康進度匯報', text: text }).catch(function() {});
    } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
}

    var name = currentUser ? currentUser.name : '個案';
    var rows = sessionHistory.slice(-15).reverse().map(function(h) {
        var bioNote = (h.metrics && h.metrics.avgJitter) ? (' [Jitter: ' + h.metrics.avgJitter + '% | Shimmer: ' + h.metrics.avgShimmer + '%]') : '';
        return '<tr><td style="padding:6px;border:1px solid #ccc;">' + new Date(h.date).toLocaleDateString('zh-HK') + '</td><td style="padding:6px;border:1px solid #ccc;">' + h.type + '</td><td style="padding:6px;border:1px solid #ccc;">' + (h.scores.join(', ') || '-') + '</td><td style="padding:6px;border:1px solid #ccc;">' + (h.note || '良好') + bioNote + '</td></tr>';
    }).join('');

    setModal(
        '<h2 style="font-size:1.5rem;margin-bottom:8px;">📋 臨床復康摘要報告 (RCT 實證與聲學生物標記)</h2>' +
        '<p style="font-size:0.95rem;color:var(--apple-dark-gray);">個案姓名：' + name + ' ｜ 累計金幣：' + goldCount + ' 💰</p>' +
        '<div style="max-height:260px;overflow-y:auto;margin:12px 0;">' +
            '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;text-align:left;">' +
                '<thead style="background:#f5f5f7;"><tr><th style="padding:6px;border:1px solid #ccc;">日期</th><th style="padding:6px;border:1px solid #ccc;">訓練類型</th><th style="padding:6px;border:1px solid #ccc;">成效分數</th><th style="padding:6px;border:1px solid #ccc;">臨床聲學紀錄</th></tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
            '</table>' +
        '</div>' +
        '<button class="sub-btn" style="background:var(--apple-black);width:100%;" onclick="showProgressUI()">返回進度</button>'
    );
}

        '<p style="font-size:0.95rem;background:rgba(0,0,0,0.04);padding:14px;border-radius:12px;margin:16px 0;">每滿 150 金幣將自動解鎖下一個實用生活訓練場景！</p>' +
        '<button class="sub-btn" style="background:var(--apple-black);width:100%;height:54px;" onclick="closeAll()">返回主頁</button>'
    );
}

function buildTrainerContext() {
    var recent = sessionHistory.slice(-20);
    var streak = 1;
    if (recent.length > 1) {
        var days = new Set(recent.map(function(h) { return new Date(h.date).toDateString(); }));
        streak = days.size;
    }
    var lastSession = recent.length ? recent[recent.length - 1] : null;
    var hadFatigue = recent.some(function(h) {
        return h.metrics && h.metrics.fatigue;
    });

    return {
        elderName: currentUser ? currentUser.name : '長者',
        streak: streak,
        lastTrainingType: lastSession ? lastSession.type : '無',
        hadFatigue: hadFatigue,
        goldNearUnlock: (150 - (goldCount % 150)) < 40
    };
}

function showTrainerChat() {
    var ctx = buildTrainerContext();
    var greeting = "你好呀" + ctx.elderName + "！我係你嘅 LohasCare 復康夥伴。";
    if (ctx.hadFatigue) {
        greeting += "睇返上次練習你有啲攰，今日我哋試下輕鬆啲嘅節奏好嗎？";
    } else if (ctx.goldNearUnlock) {
        greeting += "好犀利！差少少金幣就可以解鎖新生活情境喇，一齊加油！";
    } else if (ctx.streak > 2) {
        greeting += "你已經連續堅持咗 " + ctx.streak + " 日練習，真係好有恆心！";
    } else {
        greeting += "今日想練口肌、聲控定係吹下水？";
    }

    var bubbles = trainerChatLog.length
        ? trainerChatLog.map(function(m) { return '<div class="chat-bubble ' + m.role + '">' + m.text + '</div>'; }).join('')
        : '<div class="chat-bubble bot">' + greeting + '</div>';

    setModal(
        '<h2 style="font-size:1.5rem;margin-bottom:8px;">💬 AI 訓練夥伴 (跨 Session 記憶)</h2>' +
        '<div class="trainer-chat" id="trainer-chat-box">' + bubbles + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:8px;">' +
            '<input type="text" id="trainer-input" placeholder="請在此輸入…" style="flex:1;font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid rgba(0,0,0,0.1);" onkeydown="if(event.key===\'Enter\')sendTrainerMsg()">' +
            '<button class="sub-btn" style="background:var(--ai-blue);min-width:70px;margin:0;" onclick="sendTrainerMsg()">傳送</button>' +
        '</div>' +
        '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;">' +
            '<button class="apple-pill-btn" onclick="quickMsg(\'今日有咩建議？\')">今日建議</button>' +
            '<button class="apple-pill-btn" onclick="quickMsg(\'我有啲攰\')">我有啲攰</button>' +
            '<button class="sub-btn" style="background:var(--apple-dark-gray);" onclick="closeAll()">返回主頁</button>' +
        '</div>'
    );
}

function quickMsg(t) {
    var inp = document.getElementById('trainer-input');
    if (inp) inp.value = t;
    sendTrainerMsg();
}

function sendTrainerMsg() {
    var inp = document.getElementById('trainer-input');
    if (!inp) return;
    var msg = inp.value.trim();
    if (!msg) return;
    inp.value = '';

    trainerChatLog.push({ role: 'user', text: msg });
    var box = document.getElementById('trainer-chat-box');
    if (box) {
        box.innerHTML += '<div class="chat-bubble user">' + msg + '</div>';
        box.scrollTop = box.scrollHeight;
    }

    var ctx = buildTrainerContext();
    var reply = "一步一步慢慢練習，最緊要係每日堅持一陣，你做得好出色！";
    if (/攰|累|休息/.test(msg)) {
        reply = ctx.elderName + "，如果覺得攰就飲啖水休息下先，復康唔使急，聽日再練都完全無問題！我幫你調低動作難度啦。";
    } else if (/建議|練咩/.test(msg)) {
        reply = "建議可以由噘嘴同鼓腮開始，活化面頰與口輪匝肌，個人會精神好多！做完我哋再試聲控開花。";
    } else if (/多謝|唔該/.test(msg)) {
        reply = "唔使客氣，見到你有進步我最開心！我隨時喺度陪你練。";
    }

    setTimeout(function() {
        trainerChatLog.push({ role: 'bot', text: reply });
        saveLocal();
        if (box) {
            box.innerHTML += '<div class="chat-bubble bot">' + reply + '</div>';
            box.scrollTop = box.scrollHeight;
        }
        speak(reply);
    }, 400);
}

function setModal(html) {
    var container = document.getElementById('modal-container');
    var body = document.getElementById('modal-body');
    if (container && body) {
        container.style.display = 'flex';
        body.innerHTML = html;
        body.style.transform = 'scale(0.88)';
        requestAnimationFrame(function() {
            body.style.transition = 'transform 0.35s cubic-bezier(0.25,1,0.5,1)';
            body.style.transform = 'scale(1)';
        });
    }
}
